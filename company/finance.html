<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>المشتريات والمالية | Gulf Catering Hub</title>
<link rel="icon" href="../favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link rel="stylesheet" href="../assets/common.css">
<style>.finance-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.finance-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.actions{display:flex;gap:6px;flex-wrap:wrap}.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:850px){.finance-grid{grid-template-columns:1fr 1fr}.finance-layout{grid-template-columns:1fr}}@media(max-width:550px){.finance-grid,.pay-grid{grid-template-columns:1fr}}</style></head><body>
<header class="topbar"><div class="wrap"><nav><a class="brand" href="../"><img src="../apple-touch-icon.png" alt=""><span>Gulf Catering Hub</span></a><div class="nav-actions"><a class="ghost" href="./">مركز الشركة</a><a class="ghost" href="./rfq.html">عروض الأسعار</a><a class="ghost" href="./reports.html">التقارير والأداء</a><a class="ghost" href="./team.html">الفريق</a><button class="ghost" onclick="logout()">خروج</button></div></nav></div></header>
<main class="app" style="display:block"><div class="wrap"><div class="hello"><div><h1>المشتريات والمالية</h1><p id="companyName">أوامر الشراء، الفواتير، الدفعات ومتابعة الالتزامات.</p></div><span class="status" id="myRole">فحص الصلاحية...</span></div>
<section class="finance-grid"><div class="card"><small>قيمة الطلبات</small><div class="metric" id="mOrders">0</div></div><div class="card"><small>الفواتير المعتمدة</small><div class="metric" id="mInvoices">0</div></div><div class="card"><small>المدفوع</small><div class="metric" id="mPaid">0</div></div><div class="card"><small>الرصيد المستحق</small><div class="metric" id="mOutstanding">0</div></div></section><div style="height:14px"></div>
<div class="finance-layout"><div>
<section class="section"><div class="toolbar"><h2>أوامر الشراء (PO)</h2><button class="ghost" onclick="loadAll()">تحديث</button></div><div class="list" id="poList"></div></section>
<section class="section"><div class="toolbar"><h2>الفواتير</h2></div><div class="list" id="invoiceList"></div></section>
</div><aside>
<section class="section"><h2>إصدار أمر شراء</h2><div class="field"><label>الطلب *</label><select id="poOrder"></select></div><div class="field"><label>رقم PO</label><input id="poNumber" placeholder="اتركه فارغًا للتوليد التلقائي"></div><div class="field"><label>ملاحظات</label><textarea id="poNotes"></textarea></div><button class="primary" id="poBtn" style="width:100%" onclick="createPO()">إصدار PO</button><div class="msg" id="poMsg"></div></section>
<section class="section" id="termsSection"><h2>شروط الدفع</h2><div class="field"><label>أيام الاستحقاق الافتراضية</label><input id="termsDays" type="number" min="0" max="365"></div><button class="ghost" id="termsBtn" style="width:100%" onclick="saveTerms()">حفظ شروط الدفع</button><div class="msg" id="termsMsg"></div></section>
<section class="section"><h2>سجل الدفعات</h2><div class="list" id="paymentList"></div></section>
</aside></div></div></main>
<div class="modal" id="paymentModal" role="dialog" aria-modal="true" aria-hidden="true"><div class="modalbox"><div class="modalhead"><h2>تسجيل دفعة</h2><button class="close" onclick="GCH.closeModal('paymentModal')">×</button></div><div class="pay-grid"><div class="field"><label>المبلغ *</label><input id="payAmount" type="number" min=".001" step=".001"></div><div class="field"><label>تاريخ الدفع *</label><input id="payDate" type="date"></div></div><div class="field"><label>طريقة الدفع</label><select id="payMethod"><option value="bank_transfer">تحويل بنكي</option><option value="cash">نقدًا</option><option value="card">بطاقة</option><option value="cheque">شيك</option><option value="other">أخرى</option></select></div><div class="field"><label>المرجع</label><input id="payRef"></div><div class="field"><label>ملاحظات</label><textarea id="payNotes"></textarea></div><button class="primary" id="payBtn" style="width:100%" onclick="recordPayment()">تسجيل الدفعة</button><div class="msg" id="payMsg"></div></div></div>
<script src="../assets/common.js"></script><script src="./finance.js"></script></body></html>
