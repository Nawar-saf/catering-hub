<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>متابعة الطلبات | Gulf Catering Hub</title><link rel="icon" href="../favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link rel="stylesheet" href="../assets/common.css"><style>.tracking{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.track-step{font-size:9px;padding:5px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}.track-step.active{border-color:rgba(201,164,92,.55);color:var(--gold2)}.track-step.done{border-color:rgba(77,190,120,.4);color:#9dd7ae}.actions{display:flex;gap:6px;flex-wrap:wrap}.timeline{display:grid;gap:8px}.event{border-inline-start:2px solid var(--line);padding:8px 12px}.event b{display:block}.event small{color:var(--muted)}</style></head><body><header class="topbar"><div class="wrap"><nav><a class="brand" href="../"><img src="../apple-touch-icon.png" alt=""><span>Gulf Catering Hub</span></a><div class="nav-actions"><a class="ghost" href="./">مركز الشركة</a><a class="ghost" href="./rfq.html">عروض الأسعار</a><a class="ghost" href="./suppliers.html">المزودون</a><a class="ghost" href="../support.html">الدعم</a><button class="ghost" onclick="logout()">خروج</button></div></nav></div></header><main class="app" style="display:block"><div class="wrap"><div class="hello"><div><h1>متابعة الطلبات</h1><p>حالة تنفيذ الطلب من تأكيد المزود حتى التسليم، مع إمكانية تكرار الطلبات السابقة بعرض سعر جديد.</p></div><button class="ghost" onclick="loadAll()">تحديث</button></div><section class="section"><div class="list" id="orders"><div class="empty">جارٍ التحميل...</div></div><div class="msg" id="pageMsg"></div></section></div></main><div class="modal" id="timelineModal"><div class="modalbox"><div class="modalhead"><div><h2 id="timelineTitle">سجل التنفيذ</h2><div class="muted" id="timelineMeta"></div></div><button class="close" onclick="GCH.closeModal('timelineModal')">×</button></div><div class="timeline" id="timeline"></div></div></div><script src="../assets/common.js"></script><script>
let user=null,company=null,orders=[];const stages=['scheduled','confirmed','preparing','ready','out_for_delivery','arrived','delivered'];const L={scheduled:'مجدول',confirmed:'تم التأكيد',preparing:'قيد التجهيز',ready:'جاهز',out_for_delivery:'خرج للتسليم',arrived:'وصل للموقع',delivered:'تم التسليم',issue_reported:'مشكلة مبلّغ عنها'};
async function logout(){await GCH.db.auth.signOut();location.href='./'}
async function boot(){const {data:{user:u}}=await GCH.db.auth.getUser();if(!u){location.href='./';return}user=u;const {data:p}=await GCH.db.from('user_profiles').select('role').eq('id',u.id).maybeSingle();if(!p||!['company','admin'].includes(p.role)){location.href='./';return}const {data:c,error}=await GCH.db.from('companies').select('id,name').limit(1).maybeSingle();if(error||!c){location.href='./';return}company=c;await loadAll()}
async function loadAll(){const {data,error}=await GCH.db.from('company_orders').select('*,catering_providers(name)').eq('company_id',company.id).order('event_date',{ascending:false});if(error)return GCH.msg('pageMsg',GCH.genericError(error));orders=data||[];render()}
function render(){document.getElementById('orders').innerHTML=orders.map(o=>{const cur=o.fulfillment_status||'scheduled',idx=stages.indexOf(cur),repeatable=!!o.provider_id&&['provider_accepted','completed'].includes(o.status);return `<div class="item"><div><b>${GCH.esc(o.order_type)} — ${GCH.esc(o.catering_providers?.name||'بانتظار المزود')}</b><div class="meta">${GCH.datetime(o.event_date)} · ${GCH.number(o.people_count||0)} شخص · ${GCH.money(o.estimated_total||0)}<br>${o.fulfillment_note?GCH.esc(o.fulfillment_note):''}</div><div class="tracking">${stages.map((s,i)=>`<span class="track-step ${cur==='issue_reported'?'':i<idx?'done':i===idx?'active':''}">${L[s]}</span>`).join('')}${cur==='issue_reported'?'<span class="track-step active">مشكلة مبلّغ عنها</span>':''}</div></div><div class="actions"><span class="status st-${o.status}">${o.status==='completed'?'مكتمل':o.status==='provider_accepted'?'مقبول':o.status==='cancelled'?'ملغي':'قيد التنفيذ'}</span><button class="ghost" onclick="timeline('${o.id}')">السجل</button>${repeatable?`<a class="primary" href="./reorder.html?id=${encodeURIComponent(o.id)}">كرر الطلب</a>`:''}${['provider_accepted','completed'].includes(o.status)&&cur!=='delivered'?`<button class="danger" onclick="reportIssue('${o.id}')">إبلاغ عن مشكلة</button>`:''}</div></div>`}).join('')||'<div class="empty">لا توجد طلبات تنفيذية بعد.</div>'}
async function timeline(id){const o=orders.find(x=>x.id===id);document.getElementById('timelineTitle').textContent='سجل التنفيذ — '+o.order_type;document.getElementById('timelineMeta').textContent=GCH.datetime(o.event_date);const {data,error}=await GCH.db.from('order_fulfillment_events').select('*').eq('order_id',id).order('created_at');if(error)return GCH.msg('pageMsg',GCH.genericError(error));document.getElementById('timeline').innerHTML=(data||[]).map(e=>`<div class="event"><b>${L[e.status]||e.status}</b><div>${GCH.esc(e.note||'')}</div><small>${e.actor_role==='provider'?'المزود':e.actor_role==='company'?'شركتك':'فريق المنصة'} · ${GCH.datetime(e.created_at)}</small></div>`).join('')||'<div class="empty">لا توجد تحديثات تنفيذ بعد.</div>';GCH.openModal('timelineModal')}
async function reportIssue(id){const note=prompt('صف المشكلة باختصار:');if(!note?.trim())return;try{const {error}=await GCH.db.rpc('update_order_fulfillment',{p_order_id:id,p_status:'issue_reported',p_note:note.trim()});if(error)throw error;const {data:t,error:te}=await GCH.db.from('support_tickets').insert({category:'dispute',priority:'high',subject:'مشكلة في تنفيذ الطلب',order_id:id}).select().single();if(te)throw te;await GCH.db.from('support_messages').insert({ticket_id:t.id,message:note.trim(),sender_role:'company'});location.href='../support.html'}catch(e){console.error(e);GCH.msg('pageMsg',GCH.genericError(e))}}
GCH.setupModal('timelineModal');GCH.setupEscape();boot();
</script></body></html>
