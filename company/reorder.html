<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إعادة طلب | Gulf Catering Hub</title>
<link rel="icon" href="../favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link rel="stylesheet" href="../assets/common.css"><style>.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{border:1px solid var(--line);border-radius:14px;padding:14px;background:#100f0c}.hint{font-size:10px;color:var(--muted);line-height:1.8}@media(max-width:700px){.summary,.choice{grid-template-columns:1fr}}</style>
</head><body><header class="topbar"><div class="wrap"><nav><a class="brand" href="./orders.html"><img src="../apple-touch-icon.png" alt=""><span>Gulf Catering Hub</span></a><div class="nav-actions"><a class="ghost" href="./orders.html">الطلبات</a><a class="ghost" href="./suppliers.html">المزودون</a><a class="ghost" href="./rfq.html">عروض الأسعار</a><button class="ghost" onclick="logout()">خروج</button></div></nav></div></header>
<main class="app" style="display:block"><div class="wrap"><div class="hello"><div><h1>كرر طلبًا سابقًا</h1><p>ننسخ أساس الطلب فقط. التاريخ والمهلة والسعر الجديد يحتاجون عرضًا جديدًا.</p></div></div><div id="host"><div class="empty">جارٍ تحميل الطلب...</div></div></div></main>
<script src="../assets/common.js"></script><script>
let user=null,company=null,order=null,branches=[];
async function logout(){await GCH.db.auth.signOut();location.href='./'}
function localValue(d){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16)}
async function boot(){const id=new URLSearchParams(location.search).get('id');if(!id){location.href='./orders.html';return}const {data:{user:u}}=await GCH.db.auth.getUser();if(!u){location.href='./';return}user=u;const {data:p}=await GCH.db.from('user_profiles').select('role').eq('id',u.id).maybeSingle();if(!p||!['company','admin'].includes(p.role)){location.href='./';return}const {data:c,error}=await GCH.db.from('companies').select('id,name').limit(1).maybeSingle();if(error||!c){location.href='./';return}company=c;const [o,b]=await Promise.all([GCH.db.from('company_orders').select('*,catering_providers(name)').eq('id',id).eq('company_id',c.id).maybeSingle(),GCH.db.from('company_branches').select('*').eq('company_id',c.id).order('created_at')]);if(o.error||!o.data){location.href='./orders.html';return}order=o.data;branches=b.data||[];render()}
function render(){const event=new Date(Date.now()+7*86400000),deadline=new Date(Date.now()+3*86400000),notes=order.details?.notes||'';document.getElementById('host').innerHTML=`<div class="summary"><div class="card"><small>الطلب السابق</small><div class="metric" style="font-size:16px">${GCH.esc(order.order_type)}</div></div><div class="card"><small>المزود السابق</small><div class="metric" style="font-size:16px">${GCH.esc(order.catering_providers?.name||'غير محدد')}</div></div><div class="card"><small>عدد الأشخاص</small><div class="metric">${GCH.number(order.people_count||0)}</div></div><div class="card"><small>القيمة السابقة</small><div class="metric">${GCH.money(order.estimated_total||0,'ar',1)}</div></div></div><div style="height:14px"></div><section class="section"><div class="grid2"><div class="field"><label>عنوان الطلب *</label><input id="title" value="${GCH.esc(order.order_type||'طلب ضيافة')}"></div><div class="field"><label>الفرع *</label><select id="branch">${branches.map(x=>`<option value="${x.id}" ${x.id===order.branch_id?'selected':''}>${GCH.esc(x.name)}</option>`).join('')}</select></div></div><div class="grid2"><div class="field"><label>الموعد الجديد *</label><input id="event" type="datetime-local" value="${localValue(event)}"></div><div class="field"><label>آخر موعد للعروض *</label><input id="deadline" type="datetime-local" value="${localValue(deadline)}"></div></div><div class="grid2"><div class="field"><label>عدد الأشخاص *</label><input id="people" type="number" min="1" value="${Number(order.people_count||20)}"></div><div class="field"><label>ميزانية تقديرية (ر.ع)</label><input id="budget" type="number" min="0" step=".1" value="${Number(order.estimated_total||0)||''}"></div></div><div class="field"><label>الموقع *</label><input id="location" value="${GCH.esc([order.branch_city_snapshot,order.branch_address_snapshot].filter(Boolean).join(' - '))}"></div><div class="field"><label>المتطلبات</label><textarea id="notes">${GCH.esc(notes)}</textarea></div><div class="choice"><div class="option"><b>نفس المزود</b><p class="hint">يرسل RFQ خاص للمزود السابق فقط، إذا كان ما زال موثقًا ومتوفراً ويخدم الموعد والموقع.</p><button class="primary" id="sameBtn" ${order.provider_id?'':'disabled'} onclick="submit('same')">اطلب عرضًا جديدًا من نفس المزود</button></div><div class="option"><b>افتحه للسوق</b><p class="hint">ينشر نفس الاحتياج للمزودين المطابقين حتى تستقبل عروضًا جديدة وتقارن.</p><button class="ghost" id="marketBtn" onclick="submit('market')">انشره في السوق المفتوح</button></div></div><div class="msg" id="msg"></div></section>`}
async function submit(mode){const title=document.getElementById('title').value.trim(),branch=document.getElementById('branch').value,event=document.getElementById('event').value,deadline=document.getElementById('deadline').value,people=Number(document.getElementById('people').value),budget=document.getElementById('budget').value===''?null:Number(document.getElementById('budget').value),locationText=document.getElementById('location').value.trim(),notes=document.getElementById('notes').value.trim(),btn=document.getElementById(mode==='same'?'sameBtn':'marketBtn');if(!title||!branch||!event||!deadline||!locationText||!Number.isInteger(people)||people<1)return GCH.msg('msg','أكمل الحقول المطلوبة بشكل صحيح.');if(new Date(deadline)>=new Date(event))return GCH.msg('msg','آخر موعد للعروض يجب أن يكون قبل موعد التنفيذ.');GCH.setBusy(btn,true);try{if(mode==='same'){const {error}=await GCH.db.rpc('create_direct_provider_rfq',{p_provider_id:order.provider_id,p_branch_id:branch,p_title:title,p_request_type:'custom',p_event_date:new Date(event).toISOString(),p_people_count:people,p_location:locationText,p_budget:budget,p_budget_unit:'total',p_quote_deadline:new Date(deadline).toISOString(),p_requirements:{notes,repeat_of_order_id:order.id}});if(error)throw error}else{const {error}=await GCH.db.from('rfqs').insert({company_id:company.id,branch_id:branch,title,request_type:'custom',event_date:new Date(event).toISOString(),people_count:people,location:locationText,budget,budget_unit:'total',quote_deadline:new Date(deadline).toISOString(),sourcing_mode:'marketplace',requirements:{notes,repeat_of_order_id:order.id}});if(error)throw error}GCH.msg('msg',mode==='same'?'تم إرسال طلب عرض جديد للمزود السابق.':'تم نشر الطلب الجديد في السوق.',true);setTimeout(()=>location.href='./rfq.html',800)}catch(e){console.error(e);const m=String(e?.message||'');GCH.msg('msg',m.includes('unavailable')?'المزود السابق غير متاح لهذا الموعد. يمكنك نشر الطلب في السوق.':m.includes('capacity')?'العدد يتجاوز سعة المزود السابق.':m.includes('serve this location')?'المزود السابق لا يخدم الموقع المحدد.':GCH.genericError(e))}finally{GCH.setBusy(btn,false)}}
boot();
</script></body></html>
