<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>مزودو شركتي | Gulf Catering Hub</title>
<link rel="icon" href="../favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link rel="stylesheet" href="../assets/common.css">
<style>.filters{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:8px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.supplier{padding:18px;display:flex;flex-direction:column}.supplier.preferred{box-shadow:0 0 0 1px var(--gold)}.headrow{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.rating{color:var(--gold2);font-weight:800}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.chip{font-size:9px;padding:5px 7px;border:1px solid var(--line);border-radius:999px}.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.mini{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:10px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}@media(max-width:950px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.grid,.filters{grid-template-columns:1fr}}</style>
</head><body><header class="topbar"><div class="wrap"><nav><a class="brand" href="./"><img src="../apple-touch-icon.png" alt=""><span>Gulf Catering Hub</span></a><div class="nav-actions"><a class="ghost" href="./">مركز الشركة</a><a class="ghost" href="./rfq.html">عروض الأسعار</a><a class="ghost" href="./finance.html">المشتريات</a><button class="ghost" onclick="logout()">خروج</button></div></nav></div></header>
<main class="app" style="display:block"><div class="wrap"><div class="hello"><div><h1>مزودو شركتي</h1><p>قارن المزودين الموثقين، عيّن مزودًا مفضلاً، أو أرسل RFQ مباشرًا.</p></div><span class="status" id="preferredBadge">لا يوجد مزود مفضل</span></div>
<div class="filters"><input id="q" placeholder="ابحث باسم المزود أو المنطقة" oninput="render()"><select id="area" onchange="render()"><option value="">كل المناطق</option></select><select id="state" onchange="render()"><option value="">كل الحالات</option><option value="available">يستقبل فرصًا</option><option value="preferred">المزود المفضل</option></select></div><div class="grid" id="grid"><div class="empty">جارٍ التحميل...</div></div><div class="msg" id="msg"></div></div></main>
<script src="../assets/common.js"></script><script>
let user=null,company=null,providers=[],packages=[];
async function logout(){await GCH.db.auth.signOut();location.href='./'}
async function boot(){const {data:{user:u}}=await GCH.db.auth.getUser();if(!u){location.href='./';return}user=u;const {data:profile}=await GCH.db.from('user_profiles').select('role').eq('id',u.id).maybeSingle();if(!profile||!['company','admin'].includes(profile.role)){location.href='./';return}const {data:c,error}=await GCH.db.from('companies').select('id,name,preferred_provider_id').limit(1).maybeSingle();if(error||!c){location.href='./';return}company=c;const [p,pk]=await Promise.all([GCH.db.from('public_provider_profiles').select('*').order('performance_score',{ascending:false}).order('name'),GCH.db.from('catering_packages').select('provider_id,price_per_person').eq('active',true).eq('review_status','approved')]);if(p.error||pk.error)return GCH.msg('msg',GCH.genericError(p.error||pk.error));providers=p.data||[];packages=pk.data||[];fillFilters();render()}
function fillFilters(){const areas=[...new Set(providers.flatMap(p=>p.service_areas||[]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));document.getElementById('area').innerHTML='<option value="">كل المناطق</option>'+areas.map(x=>`<option>${GCH.esc(x)}</option>`).join('')}
function render(){const q=document.getElementById('q').value.trim().toLowerCase(),area=document.getElementById('area').value,state=document.getElementById('state').value;const preferred=providers.find(x=>x.provider_id===company.preferred_provider_id);document.getElementById('preferredBadge').textContent=preferred?`المفضل: ${preferred.name}`:'لا يوجد مزود مفضل';document.getElementById('preferredBadge').className='status '+(preferred?'st-approved':'st-pending');const rows=providers.filter(p=>{const text=[p.name,...(p.service_areas||[])].join(' ').toLowerCase(),available=p.accepting_marketplace_requests&&p.availability_status!=='paused';return(!q||text.includes(q))&&(!area||(p.service_areas||[]).includes(area))&&(!state||(state==='available'&&available)||(state==='preferred'&&p.provider_id===company.preferred_provider_id))});document.getElementById('grid').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">لا يوجد مزود يطابق الفلاتر الحالية.</div>'}
function card(p){const preferred=p.provider_id===company.preferred_provider_id,available=p.accepting_marketplace_requests&&p.availability_status!=='paused',rating=Number(p.average_rating||0),reviews=Number(p.review_count||0),prices=packages.filter(x=>x.provider_id===p.provider_id).map(x=>Number(x.price_per_person||0)).filter(x=>x>0),min=prices.length?Math.min(...prices):null;return `<article class="card supplier ${preferred?'preferred':''}"><div class="headrow"><div><span class="eyebrow">${preferred?'المزود المفضل':'مزود موثّق'}</span><h2>${GCH.esc(p.name)}</h2><div class="rating">${reviews?`★ ${rating.toFixed(1)} · ${GCH.number(reviews)} تقييم`:'مزود جديد'}</div></div><span class="status ${available?'st-approved':'st-pending'}">${available?'يستقبل فرصًا':'غير متاح الآن'}</span></div><div class="chips">${(p.service_areas||[]).slice(0,4).map(x=>`<span class="chip">${GCH.esc(x)}</span>`).join('')}</div><div class="meta-grid"><div class="mini">سعة: <b>${p.max_capacity?GCH.number(p.max_capacity):'مرنة'}</b></div><div class="mini">مهلة: <b>${GCH.number(p.lead_time_hours||24)} ساعة</b></div><div class="mini">طلبات مكتملة: <b>${GCH.number(p.completed_orders_count||0)}</b></div><div class="mini">${min!==null?`من <b>${GCH.money(min,'ar',1)}</b>/شخص`:'حسب الطلب'}</div></div><div class="actions"><a class="ghost" target="_blank" rel="noopener" href="../provider.html?id=${encodeURIComponent(p.provider_id)}">عرض الملف</a>${available?`<button class="primary" onclick="direct('${p.provider_id}')">اطلب عرضًا مباشرًا</button>`:''}<button class="ghost" onclick="setPreferred('${p.provider_id}',${preferred?'true':'false'})">${preferred?'إلغاء التفضيل':'تعيين كمفضل'}</button></div></article>`}
function direct(id){localStorage.setItem('gch_direct_provider',id);location.href='./rfq.html?create=1&direct=1'}
async function setPreferred(id,isPreferred){try{const value=isPreferred?null:id,{data,error}=await GCH.db.from('companies').update({preferred_provider_id:value}).eq('id',company.id).select('id,name,preferred_provider_id').single();if(error)throw error;company=data;GCH.msg('msg',isPreferred?'تم إلغاء المزود المفضل.':'تم تعيين المزود المفضل.',true);render()}catch(e){console.error(e);GCH.msg('msg',GCH.genericError(e))}}
boot();
</script></body></html>
