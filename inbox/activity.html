<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>سجل العمليات | Gulf Catering Hub</title>
<link rel="icon" href="../favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link rel="stylesheet" href="../assets/common.css">
<style>.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.filters{display:flex;gap:7px;flex-wrap:wrap}.timeline{display:grid;gap:0}.event{position:relative;padding:13px 18px 13px 12px;border-right:2px solid var(--line)}.event:before{content:'';position:absolute;right:-6px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--gold)}.event small{display:block;color:var(--muted)}@media(max-width:700px){.metrics{grid-template-columns:1fr 1fr}}</style></head><body>
<header class="topbar"><div class="wrap"><nav><a class="brand" href="../"><img src="../apple-touch-icon.png" alt=""><span>Gulf Catering Hub — الإدارة</span></a><div class="nav-actions"><a class="ghost" href="./">العمليات</a><a class="ghost" href="./rfq.html">RFQ</a><a class="ghost" href="./finance.html">المالية</a><a class="ghost" href="./performance.html">الأداء</a><button class="ghost" onclick="logout()">خروج</button></div></nav></div></header>
<main class="app" style="display:block"><div class="wrap"><div class="hello"><div><h1>سجل العمليات والإشعارات</h1><p>Timeline مركزي لأهم تغييرات المنصة.</p></div><button class="ghost" onclick="loadAll()">تحديث</button></div>
<section class="metrics"><div class="card"><small>أحداث اليوم</small><div class="metric" id="mToday">0</div></div><div class="card"><small>RFQ / عروض</small><div class="metric" id="mQuotes">0</div></div><div class="card"><small>مالية</small><div class="metric" id="mFinance">0</div></div><div class="card"><small>تنفيذ وجبات</small><div class="metric" id="mMeals">0</div></div></section><div style="height:14px"></div>
<section class="section"><div class="toolbar"><h2>آخر الأحداث</h2><div class="filters"><button class="ghost active" data-filter="all">الكل</button><button class="ghost" data-filter="rfq">RFQ</button><button class="ghost" data-filter="order">طلبات</button><button class="ghost" data-filter="finance">مالية</button><button class="ghost" data-filter="meal">وجبات</button><button class="ghost" data-filter="review">تقييمات</button></div></div><div class="timeline" id="events"><div class="empty">جارٍ التحميل...</div></div></section>
<section class="section"><div class="toolbar"><h2>الإشعارات المُنشأة</h2><span class="muted small">آخر 100 إشعار داخلي</span></div><div class="list" id="notifications"></div></section>
</div></main><script src="../assets/common.js"></script><script src="./activity.js"></script></body></html>
