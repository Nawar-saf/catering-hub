<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>إدارة المشتريات والمالية | Gulf Catering Hub</title>
<link rel="icon" href="../favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link rel="stylesheet" href="../assets/common.css">
<style>.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tabs2{display:flex;gap:6px;flex-wrap:wrap}.tabs2 button.active{background:var(--gold);color:#111}.actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:700px){.metrics{grid-template-columns:1fr 1fr}}</style></head><body>
<header class="topbar"><div class="wrap"><nav><a class="brand" href="../"><img src="../apple-touch-icon.png" alt=""><span>Gulf Catering Hub — الإدارة</span></a><div class="nav-actions"><a class="ghost" href="./">العمليات</a><a class="ghost" href="./rfq.html">RFQ</a><button class="ghost" onclick="logout()">خروج</button></div></nav></div></header>
<main class="app" style="display:block"><div class="wrap"><div class="hello"><div><h1>إدارة المشتريات والمالية</h1><p>متابعة أوامر الشراء والفواتير والدفعات على مستوى المنصة.</p></div><button class="ghost" onclick="loadAll()">تحديث</button></div>
<section class="metrics"><div class="card"><small>أوامر الشراء</small><div class="metric" id="mPO">0</div></div><div class="card"><small>قيمة الفواتير</small><div class="metric" id="mInv">0</div></div><div class="card"><small>المدفوع</small><div class="metric" id="mPaid">0</div></div><div class="card"><small>المستحق</small><div class="metric" id="mOut">0</div></div></section><div style="height:14px"></div>
<div class="tabs2"><button class="ghost active" data-tab="invoices">الفواتير</button><button class="ghost" data-tab="po">أوامر الشراء</button><button class="ghost" data-tab="payments">الدفعات</button></div><section class="section"><div id="host"><div class="empty">جارٍ التحميل...</div></div></section></div></main>
<div class="modal" id="paymentModal" role="dialog" aria-modal="true" aria-hidden="true"><div class="modalbox"><div class="modalhead"><h2>تسجيل دفعة إدارية</h2><button class="close" onclick="GCH.closeModal('paymentModal')">×</button></div><div class="field"><label>المبلغ</label><input id="payAmount" type="number" min=".001" step=".001"></div><div class="field"><label>التاريخ</label><input id="payDate" type="date"></div><div class="field"><label>الطريقة</label><select id="payMethod"><option value="bank_transfer">تحويل بنكي</option><option value="cash">نقدًا</option><option value="card">بطاقة</option><option value="cheque">شيك</option><option value="other">أخرى</option></select></div><div class="field"><label>المرجع</label><input id="payRef"></div><button class="primary" id="payBtn" style="width:100%" onclick="recordPayment()">تسجيل</button><div class="msg" id="payMsg"></div></div></div>
<script src="../assets/common.js"></script><script src="./finance.js"></script></body></html>
