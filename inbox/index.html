<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations Dashboard — Gulf Catering Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#080705;--panel:#11100d;--panel2:#17140f;--line:#302a21;--gold:#c9a45c;--gold2:#f1d28b;--txt:#fbf8f1;--muted:#aaa195;--green:#64dda5;--red:#ff8d8d;--blue:#86b7ff;--purple:#d0a0ff}*{box-sizing:border-box}body{margin:0;font-family:Cairo,sans-serif;background:radial-gradient(circle at 10% 0%,rgba(201,164,92,.13),transparent 24%),var(--bg);color:var(--txt)}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}header{border-bottom:1px solid rgba(201,164,92,.15);background:rgba(8,7,5,.88);backdrop-filter:blur(15px);position:sticky;top:0;z-index:20}.top{height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;color:var(--gold2);text-decoration:none}.actions{display:flex;gap:8px;align-items:center}.primary,.ghost,.danger{border-radius:11px;padding:9px 13px;font-weight:800}.primary{border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1308}.ghost{border:1px solid var(--line);background:#11100d;color:white}.danger{border:1px solid rgba(255,141,141,.35);background:rgba(255,141,141,.08);color:#ffb3b3}.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.authbox{width:min(450px,100%);border:1px solid rgba(201,164,92,.28);background:linear-gradient(150deg,#17140f,#0c0b09);border-radius:24px;padding:25px}.authbox h1{margin:0 0 6px;color:var(--gold2)}.muted{color:var(--muted);font-size:12px;line-height:1.7}.field{display:grid;gap:6px;margin-top:10px}.field label{font-size:11px;color:#d8d0c4;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#0d0c09;color:white;border-radius:11px;padding:11px;outline:none}.field textarea{min-height:86px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{margin-top:10px;border-radius:10px;padding:10px;font-size:11px;display:none}.msg.show{display:block}.msg.ok{border:1px solid rgba(100,221,165,.35);background:rgba(100,221,165,.08);color:#9af0c4}.msg.err{border:1px solid rgba(255,141,141,.35);background:rgba(255,141,141,.08);color:#ffb1b1}.app{display:none;padding:26px 0 50px}.hello{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:15px}.hello h1{margin:0;font-size:30px}.hello p{margin:4px 0 0;color:var(--muted);font-size:12px}.notice{border:1px solid rgba(134,183,255,.25);background:rgba(134,183,255,.07);color:#cce0ff;border-radius:13px;padding:11px;font-size:11px;margin-bottom:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.card,.section{border:1px solid var(--line);background:linear-gradient(145deg,var(--panel2),var(--panel));border-radius:17px;padding:16px}.card small{color:var(--muted);font-size:10px}.metric{font-size:25px;font-weight:900;color:var(--gold2);margin-top:4px}.bar{height:7px;background:#27231d;border-radius:99px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0}.layout{display:grid;grid-template-columns:1.45fr .8fr;gap:13px}.section{margin-bottom:13px}.section h2{font-size:16px;margin:0 0 11px;color:#f5e3b7}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.list{display:grid;gap:8px}.item{border:1px solid rgba(255,255,255,.07);background:#0d0c09;border-radius:12px;padding:11px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item b{font-size:12px}.meta{color:var(--muted);font-size:10px;margin-top:4px;line-height:1.6}.status{display:inline-block;border-radius:99px;padding:4px 7px;font-size:9px;border:1px solid var(--line)}.st-pending_approval{color:#ffd37a;border-color:rgba(255,211,122,.35)}.st-approved{color:#9bc4ff;border-color:rgba(155,196,255,.35)}.st-sent_to_provider{color:#d8afff;border-color:rgba(216,175,255,.35)}.st-provider_accepted,.st-completed{color:#92e8bb;border-color:rgba(146,232,187,.35)}.st-provider_rejected,.st-cancelled{color:#ffadad;border-color:rgba(255,173,173,.35)}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);border-radius:99px;padding:5px 8px;font-size:9px;color:#ccc4b8}.empty{color:var(--muted);font-size:11px;padding:16px;text-align:center}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.tab{border:1px solid var(--line);background:#0d0c09;color:#c9c1b5;padding:7px 10px;border-radius:99px;font-size:10px}.tab.active{color:var(--gold2);border-color:rgba(201,164,92,.45);background:rgba(201,164,92,.08)}.table{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:960px}th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.06);font-size:10px;text-align:right;vertical-align:top}th{color:var(--gold2);background:#17140f}.login-switch{margin-top:12px;color:var(--gold2);font-size:11px;background:none;border:0;padding:0}.loader{padding:30px;text-align:center;color:var(--muted)}@media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.hello{align-items:start;flex-direction:column}}@media(max-width:600px){.formgrid{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}.actions .hide-mobile{display:none}.item{align-items:flex-start;flex-direction:column}}
.adminGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:13px}.adminGrid .card{padding:12px}.adminGrid .metric{font-size:21px}@media(max-width:900px){.adminGrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:550px){.adminGrid{grid-template-columns:repeat(2,1fr)}}</style><link rel="icon" href="../favicon.ico"><link rel="manifest" href="../site.webmanifest"></head><body>
<section class="auth" id="auth"><div class="authbox"><h1>Operations Dashboard</h1><p class="muted">دخول الإدارة فقط.</p><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password"></div><button class="primary" style="width:100%;margin-top:13px" onclick="login()">تسجيل الدخول</button><div class="msg" id="authMsg"></div></div></section>
<header id="header" style="display:none"><div class="wrap top"><a class="brand" href="../">Gulf Catering Hub — Operations</a><div class="actions"><button class="ghost" onclick="loadAll()">تحديث</button><button class="ghost" onclick="logout()">خروج</button></div></div></header>
<main class="app" id="app"><div class="wrap"><div class="hello"><div><h1>Operations Dashboard</h1><p>طلبات عامة، طلبات الشركات، المزودون، الباقات، والبرامج المتكررة.</p></div></div><section class="adminGrid"><div class="card"><small>طلبات عامة</small><div class="metric" id="sLegacy">0</div></div><div class="card"><small>طلبات شركات</small><div class="metric" id="sOrders">0</div></div><div class="card"><small>مزودون</small><div class="metric" id="sProviders">0</div></div><div class="card"><small>بانتظار اعتماد</small><div class="metric" id="sPendingProviders">0</div></div><div class="card"><small>باقات قيد المراجعة</small><div class="metric" id="sPendingPackages">0</div></div><div class="card"><small>برامج متكررة</small><div class="metric" id="sRecurring">0</div></div></section><nav class="tabs" id="tabs"><button class="tab active" data-tab="orders">طلبات الشركات</button><button class="tab" data-tab="providers">المزودون</button><button class="tab" data-tab="packages">الباقات</button><button class="tab" data-tab="recurring">الوجبات المتكررة</button><button class="tab" data-tab="legacy">الطلبات العامة</button></nav><section class="section"><div id="host" class="loader">جاري التحميل...</div></section></div></main>
<script>
const SUPABASE_URL='https://yyeqzyvveecmgpoppfhz.supabase.co',SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5ZXF6eXZ2ZWVjbWdwb3BwZmh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzU4NjksImV4cCI6MjEwMzE1MTg2OX0.ufLK7RKUz46VPZPVPTaQwn18uFTE7Zn2Gi6gHcjNX7M',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let currentTab='orders',legacy=[],orders=[],providers=[],packages=[],recurring=[];function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function msg(text,ok=false){const e=document.getElementById('authMsg');e.textContent=text;e.className='msg show '+(ok?'ok':'err')}async function login(){const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)return msg('بيانات الدخول غير صحيحة');await boot()}async function logout(){await db.auth.signOut();location.reload()}async function boot(){const {data:{user}}=await db.auth.getUser();if(!user)return;const {data:p,error}=await db.from('user_profiles').select('role').eq('id',user.id).maybeSingle();if(error)return msg('تعذر تحميل الحساب. حاول مجددًا أو تواصل مع الإدارة.');if(!p||p.role!=='admin'){await db.auth.signOut();return msg('هذا الحساب لا يملك صلاحية الدخول إلى لوحة الإدارة.')}document.getElementById('auth').style.display='none';document.getElementById('header').style.display='block';document.getElementById('app').style.display='block';await loadAll()}
async function loadAll(){document.getElementById('host').innerHTML='<div class="loader">جاري التحميل...</div>';const rs=await Promise.all([db.from('requests').select('*').order('id',{ascending:false}),db.from('company_orders').select('*,companies(name),company_branches(name),catering_providers(name),catering_packages(name)').order('created_at',{ascending:false}),db.from('catering_providers').select('*').order('created_at',{ascending:false}),db.from('catering_packages').select('*,catering_providers(name,status)').order('created_at',{ascending:false}),db.from('recurring_meal_plans').select('*,companies(name),company_branches(name)').order('created_at',{ascending:false})]);const failed=rs.find(r=>r.error);if(failed){document.getElementById('host').textContent='تعذر تحميل البيانات. حاول التحديث مرة أخرى.';return}legacy=rs[0].data||[];orders=rs[1].data||[];providers=rs[2].data||[];packages=rs[3].data||[];recurring=rs[4].data||[];document.getElementById('sLegacy').textContent=legacy.length;document.getElementById('sOrders').textContent=orders.length;document.getElementById('sProviders').textContent=providers.length;document.getElementById('sPendingProviders').textContent=providers.filter(x=>x.status==='pending').length;document.getElementById('sPendingPackages').textContent=packages.filter(x=>x.review_status==='pending_review').length;document.getElementById('sRecurring').textContent=recurring.length;render()}
function render(){if(currentTab==='orders')renderOrders();else if(currentTab==='providers')renderProviders();else if(currentTab==='packages')renderPackages();else if(currentTab==='recurring')renderRecurring();else renderLegacy()}function table(headers,rows){document.getElementById('host').innerHTML=rows.length?`<div class="table"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<div class="empty">لا توجد بيانات.</div>'}
function providerOptions(selected=''){return '<option value="">— اختر مزود —</option>'+providers.filter(p=>p.status==='approved').map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('')}
function renderOrders(){table(['الشركة','النوع','التاريخ','الأشخاص','القيمة','الحالة','المزوّد','إجراء'],orders.map(o=>`<tr><td>${esc(o.companies?.name||'')}</td><td>${esc(o.order_type)}</td><td>${o.event_date?new Date(o.event_date).toLocaleString('ar-OM'):''}</td><td>${o.people_count||''}</td><td>${Number(o.estimated_total||0).toFixed(1)} ر.ع</td><td><span class="status st-${o.status}">${esc(o.status)}</span></td><td>${esc(o.catering_providers?.name||'—')}</td><td>${o.status==='approved'||o.status==='provider_rejected'?`<select id="prov-${o.id}" style="max-width:150px">${providerOptions(o.provider_id)}</select> <button class="primary" onclick="assignProvider('${o.id}')">تعيين</button>`:''} ${o.status==='provider_accepted'?`<button class="ghost" onclick="setOrderStatus('${o.id}','completed')">مكتمل</button>`:''}</td></tr>`))}
function renderProviders(){table(['الاسم','الهاتف','المناطق','المطابخ','السعة','الحالة','إجراء'],providers.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.phone)}</td><td>${esc((p.service_areas||[]).join('، '))}</td><td>${esc((p.cuisines||[]).join('، '))}</td><td>${p.max_capacity||''}</td><td>${esc(p.status)}</td><td>${p.status!=='approved'?`<button class="primary" onclick="providerStatus('${p.id}','approved')">اعتماد</button>`:`<button class="danger" onclick="providerStatus('${p.id}','suspended')">إيقاف</button>`}</td></tr>`))}
function renderPackages(){table(['المزوّد','الباقة','التصنيف','السعر','النطاق','الحالة','إجراء'],packages.map(p=>`<tr><td>${esc(p.catering_providers?.name||'')}</td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${Number(p.price_per_person||0).toFixed(1)} ر.ع</td><td>${p.min_people}–${p.max_people}</td><td>${p.active?'نشطة':esc(p.review_status||'draft')}</td><td>${p.active?`<button class="danger" onclick="disablePackage('${p.id}')">إلغاء النشر</button>`:p.review_status==='pending_review'?`<button class="primary" onclick="approvePackage('${p.id}')">اعتماد ونشر</button>`:'بانتظار إرسال المورد'}</td></tr>`))}
function renderRecurring(){table(['الشركة','الفرع','الموظفون','أيام/أسبوع','سعر/موظف','الحالة','إجراء'],recurring.map(r=>`<tr><td>${esc(r.companies?.name||'')}</td><td>${esc(r.company_branches?.name||'')}</td><td>${r.employees}</td><td>${r.days_per_week}</td><td>${Number(r.price_per_employee||0).toFixed(1)} ر.ع</td><td>${esc(r.status)}</td><td>${r.status==='pending'?`<button class="primary" onclick="recStatus('${r.id}','active')">تفعيل</button>`:`<button class="ghost" onclick="recStatus('${r.id}','cancelled')">إلغاء</button>`}</td></tr>`))}
function renderLegacy(){table(['الاسم','الهاتف','الطلب','التاريخ','العدد','الميزانية','الحالة','تواصل','إجراء'],legacy.map(r=>{const phone=String(r.phone_number||r.phone||'').replace(/[^0-9]/g,'');const wa=phone?(phone.startsWith('00')?phone.slice(2):phone):'';return `<tr><td>${esc(r.full_name||r.name)}</td><td>${esc(r.phone_number||r.phone)}</td><td>${esc(r.event_type)}<details><summary>التفاصيل</summary><div style="white-space:pre-wrap">${esc(r.details||'لا توجد تفاصيل إضافية')}</div></details></td><td>${esc(r.event_date)}</td><td>${esc(r.people_count)}</td><td>${esc(r.budget)}</td><td>${esc(r.status)}</td><td>${wa?`<a class="ghost" href="https://wa.me/${wa}" target="_blank" rel="noopener noreferrer">واتساب</a>`:'—'}</td><td>${String(r.status||'')==='جديد'?`<button class="ghost" onclick="setLegacyStatus(${Number(r.id)},'قيد المتابعة')">قيد المتابعة</button>`:''} ${String(r.status||'')!=='مكتمل'?`<button class="ghost" onclick="setLegacyStatus(${Number(r.id)},'مكتمل')">مكتمل</button>`:''}</td></tr>`}))}
async function assignProvider(id){const provider_id=document.getElementById('prov-'+id).value;if(!provider_id)return alert('اختر مزودًا');const {error}=await db.from('company_orders').update({provider_id,status:'sent_to_provider',assigned_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await loadAll()}async function setOrderStatus(id,status){const {error}=await db.from('company_orders').update({status,completed_at:status==='completed'?new Date().toISOString():null}).eq('id',id);if(error)return alert(error.message);await loadAll()}async function providerStatus(id,status){const {error}=await db.from('catering_providers').update({status}).eq('id',id);if(error)return alert(error.message);await loadAll()}async function approvePackage(id){const p=packages.find(x=>x.id===id);if(p?.review_status!=='pending_review')return alert('الباقة لم تُرسل للمراجعة بعد');if(p?.catering_providers?.status!=='approved')return alert('اعتمد المزود أولاً');const {error}=await db.from('catering_packages').update({active:true,review_status:'approved'}).eq('id',id);if(error)return alert(error.message);await loadAll()}async function disablePackage(id){const {error}=await db.from('catering_packages').update({active:false,review_status:'draft'}).eq('id',id);if(error)return alert(error.message);await loadAll()}async function recStatus(id,status){const {error}=await db.from('recurring_meal_plans').update({status}).eq('id',id);if(error)return alert(error.message);await loadAll()}async function setLegacyStatus(id,status){if(!Number.isSafeInteger(id)||!['قيد المتابعة','مكتمل'].includes(status))return;const {error}=await db.from('requests').update({status}).eq('id',id);if(error)return alert(error.message);await loadAll()}document.getElementById('tabs').onclick=e=>{if(!e.target.dataset.tab)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');currentTab=e.target.dataset.tab;render()};(async()=>{const {data}=await db.auth.getSession();if(data.session)boot()})();
</script></body></html>
