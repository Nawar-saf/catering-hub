<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة التحكم - GULF CATERING HUB</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#c5a059" />

    <link rel="apple-touch-icon" href="./icon-192.png" />
    <script
      src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
      defer
    ></script>

    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];

     OneSignalDeferred.push(async function(OneSignal) {

    await OneSignal.init({
        appId: "1b359f57-2858-481f-b5a0-56253c46776d",
        notifyButton: {
            enable: true
        }
    });

});
      OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.User.PushSubscription.optIn();
});
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="GCH Inbox" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --gold: #c5a059;
        --gold-light: #ffd700;
        --gold-dark: #8b6914;
        --black: #0a0500;
        --black-light: #1a0f05;
        --black-medium: #2a1a0a;
        --white: #fff;
        --gray-light: #f5f5f5;
        --gray: #aaa;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Cairo", sans-serif;
        background-color: var(--black);
        color: var(--white);
        min-height: 100vh;
      }

      /* LOGIN */

      .login-screen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-box {
        width: 100%;
        max-width: 420px;
        background: linear-gradient(
          135deg,
          rgba(26, 15, 5, 0.98),
          rgba(42, 26, 10, 0.98)
        );
        border: 1px solid rgba(197, 160, 89, 0.5);
        border-radius: 24px;
        padding: 35px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }

      .login-title {
        text-align: center;
        color: var(--gold);
        font-size: 27px;
        font-weight: 900;
        margin-bottom: 5px;
      }

      .login-subtitle {
        text-align: center;
        color: var(--gray);
        margin-bottom: 30px;
        font-size: 14px;
      }

      .login-input {
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 15px;
        border-radius: 12px;
        border: 1px solid rgba(197, 160, 89, 0.4);
        background: rgba(0, 0, 0, 0.35);
        color: white;
        font-family: Cairo, sans-serif;
        font-size: 15px;
        outline: none;
      }

      .login-input:focus {
        border-color: var(--gold);
      }

      .login-btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(
          90deg,
          var(--gold-dark),
          var(--gold),
          var(--gold-light)
        );
        color: var(--black);
        font-family: Cairo, sans-serif;
        font-size: 16px;
        font-weight: 900;
        cursor: pointer;
      }

      .login-btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .login-error {
        color: #ff6b6b;
        text-align: center;
        font-size: 13px;
        margin-top: 15px;
        min-height: 20px;
      }

      /* DASHBOARD */

      .dashboard {
        display: none;
        padding: 20px;
      }

      .container {
        max-width: 1300px;
        margin: 0 auto;
      }

      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;

        background: linear-gradient(
          135deg,
          rgba(26, 15, 5, 0.96),
          rgba(42, 26, 10, 0.96)
        );

        border: 1px solid rgba(197, 160, 89, 0.5);
        border-radius: 20px;
        padding: 20px 30px;
        margin-bottom: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      .admin-title {
        color: var(--gold);
        font-size: 24px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .header-actions {
        display: flex;
        gap: 10px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: linear-gradient(
          135deg,
          rgba(26, 15, 5, 0.96),
          rgba(42, 26, 10, 0.96)
        );

        border: 1px solid rgba(197, 160, 89, 0.3);
        border-radius: 16px;
        padding: 20px;
        text-align: center;
      }

      .stat-number {
        font-size: 32px;
        font-weight: 700;
        color: var(--gold-light);
        margin-top: 5px;
      }

      .stat-label {
        font-size: 14px;
        color: var(--gray);
      }

      .table-responsive {
        background: linear-gradient(
          135deg,
          rgba(26, 15, 5, 0.96),
          rgba(42, 26, 10, 0.96)
        );

        border: 1px solid rgba(197, 160, 89, 0.5);
        border-radius: 20px;
        overflow-x: auto;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: right;
      }

      th,
      td {
        padding: 15px 20px;
        border-bottom: 1px solid rgba(197, 160, 89, 0.2);
        font-size: 14px;
      }

      th {
        background: rgba(197, 160, 89, 0.1);
        color: var(--gold);
        font-weight: 700;
      }

      tr:hover {
        background: rgba(197, 160, 89, 0.05);
      }

      .badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
      }

      .badge-new {
        background: rgba(255, 193, 7, 0.2);
        color: #ffc107;
        border: 1px solid #ffc107;
      }

      .badge-done {
        background: rgba(76, 175, 80, 0.2);
        color: #4caf50;
        border: 1px solid #4caf50;
      }

      .btn {
        padding: 8px 16px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-family: Cairo, sans-serif;
        font-weight: 700;
        font-size: 13px;
      }

      .btn-gold {
        background: var(--gold);
        color: var(--black);
      }

      .btn-danger {
        background: rgba(244, 67, 54, 0.2);
        color: #f44336;
        border: 1px solid #f44336;
      }

      .refresh-btn {
        background: none;
        border: 1px solid var(--gold);
        color: var(--gold);
        padding: 8px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-family: Cairo, sans-serif;
      }

      .logout-btn {
        background: rgba(244, 67, 54, 0.12);
        border: 1px solid rgba(244, 67, 54, 0.6);
        color: #ff6b6b;
        padding: 8px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-family: Cairo, sans-serif;
      }

      .loading-state,
      .empty-state {
        text-align: center;
        padding: 40px;
        color: var(--gray);
        font-size: 16px;
      }

      @media (max-width: 700px) {
        .admin-header {
          flex-direction: column;
          align-items: stretch;
        }

        .admin-title {
          justify-content: center;
          text-align: center;
          font-size: 19px;
        }

        .header-actions {
          justify-content: center;
        }
      }
    </style>
  </head>

  <body>
    <!-- LOGIN -->

    <div id="loginScreen" class="login-screen">
      <div class="login-box">
        <div class="login-title">GULF CATERING HUB</div>

        <div class="login-subtitle">تسجيل الدخول إلى لوحة الطلبات</div>

        <input
          type="email"
          id="email"
          class="login-input"
          placeholder="البريد الإلكتروني"
          autocomplete="email"
        />

        <input
          type="password"
          id="password"
          class="login-input"
          placeholder="كلمة المرور"
          autocomplete="current-password"
        />

        <button id="loginButton" class="login-btn" onclick="login()">
          تسجيل الدخول
        </button>

        <div id="loginError" class="login-error"></div>
      </div>
    </div>

    <!-- DASHBOARD -->

    <div id="dashboard" class="dashboard">
      <div class="container">
        <div class="admin-header">
          <div class="admin-title">
            <span>📊</span>
            لوحة تحكم طلبات الكيترنج
          </div>

          <div class="header-actions">
            <button class="refresh-btn" onclick="fetchRequests()">
              🔄 تحديث
            </button>

            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">إجمالي الطلبات</div>

            <div class="stat-number" id="totalRequests">0</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">الطلبات الجديدة</div>

            <div class="stat-number" id="newRequests">0</div>
          </div>
        </div>

        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>الاسم</th>

                <th>رقم الهاتف</th>

                <th>نوع المناسبة</th>

                <th>التاريخ</th>

                <th>عدد الأشخاص</th>

                <th>الوقت والميزانية</th>

                <th>الحالة</th>

                <th>الإجراءات</th>
              </tr>
            </thead>

            <tbody id="requestsTableBody">
              <tr>
                <td colspan="8" class="loading-state">جاري تحميل الطلبات...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const SUPABASE_URL = "https://yyeqzyvveecmgpoppfhz.supabase.co";

      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5ZXF6eXZ2ZWVjbWdwb3BwZmh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzU4NjksImV4cCI6MjEwMzE1MTg2OX0.ufLK7RKUz46VPZPVPTaQwn18uFTE7Zn2Gi6gHcjNX7M";

      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      /* =========================
   LOGIN
========================= */

      async function login() {
        const email = document.getElementById("email").value.trim();

        const password = document.getElementById("password").value;

        const errorBox = document.getElementById("loginError");

        const button = document.getElementById("loginButton");

        errorBox.textContent = "";

        if (!email || !password) {
          errorBox.textContent = "أدخل البريد الإلكتروني وكلمة المرور";

          return;
        }

        button.disabled = true;
        button.textContent = "جاري الدخول...";

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        button.disabled = false;
        button.textContent = "تسجيل الدخول";

        if (error) {
          console.error(error);

          errorBox.textContent = "البريد الإلكتروني أو كلمة المرور غير صحيحة";

          return;
        }

        showDashboard();
      }

      /* =========================
   LOGOUT
========================= */

      async function logout() {
        await supabaseClient.auth.signOut();

        document.getElementById("dashboard").style.display = "none";

        document.getElementById("loginScreen").style.display = "flex";
      }

      /* =========================
   CHECK SESSION
========================= */

      async function checkSession() {
        const { data } = await supabaseClient.auth.getSession();

        if (data.session) {
          showDashboard();
        } else {
          document.getElementById("loginScreen").style.display = "flex";
        }
      }

      /* =========================
   SHOW DASHBOARD
========================= */

      function showDashboard() {
        document.getElementById("loginScreen").style.display = "none";

        document.getElementById("dashboard").style.display = "block";

        fetchRequests();
      }

      /* =========================
   FETCH REQUESTS
========================= */

      async function fetchRequests() {
        const tbody = document.getElementById("requestsTableBody");

        tbody.innerHTML = `<tr>
            <td
                colspan="8"
                class="loading-state"
            >
                جاري التحديث...
            </td>
        </tr>`;

        try {
          const { data, error } = await supabaseClient

            .from("requests")

            .select("*")

            .order("created_at", { ascending: false });

          if (error) throw error;

          renderTable(data || []);
        } catch (err) {
          console.error(err);

          tbody.innerHTML = `<tr>
                <td
                    colspan="8"
                    class="loading-state"
                    style="color:#f44336;"
                >
                    ❌ حدث خطأ أثناء جلب البيانات
                </td>
            </tr>`;
        }
      }

      /* =========================
   RENDER TABLE
========================= */

      function renderTable(requests) {
        document.getElementById("totalRequests").textContent = requests.length;

        const newCount = requests.filter((r) => r.status === "جديد").length;

        document.getElementById("newRequests").textContent = newCount;

        const tbody = document.getElementById("requestsTableBody");

        if (requests.length === 0) {
          tbody.innerHTML = `<tr>
                <td
                    colspan="8"
                    class="empty-state"
                >
                    لا توجد طلبات حتى الآن
                </td>
            </tr>`;

          return;
        }

        tbody.innerHTML = requests

          .map(
            (req) => `

            <tr>

                <td>
                    <strong>
                        ${req.full_name || req.name || "غير معروف"}
                    </strong>
                </td>


                <td
                    dir="ltr"
                    style="text-align:right;"
                >

                    ${req.phone_number || req.phone || "-"}

                </td>


                <td>
                    ${req.event_type || "-"}
                </td>


                <td>
                    ${req.event_date || "-"}
                </td>


                <td>
                    ${req.people_count || "-"}
                </td>


                <td>

                    <small>
                        الوقت:
                        ${req.buffet_time || "-"}
                    </small>

                    <br>

                    <small
                        style="color:var(--gold);"
                    >

                        الميزانية:
                        ${req.budget || "غير محدد"}

                    </small>

                </td>


                <td>

                    <span
                        class="badge ${
                          req.status === "مكتمل" ? "badge-done" : "badge-new"
                        }"
                    >

                        ${req.status || "جديد"}

                    </span>

                </td>


                <td>

                    <div
                        style="
                            display:flex;
                            gap:8px;
                        "
                    >

                        ${
                          req.status !== "مكتمل"
                            ? `<button
                                class="btn btn-gold"
                                onclick="
                                    updateStatus(
                                        '${req.id}',
                                        'مكتمل'
                                    )
                                "
                            >
                                تم ✅
                            </button>`
                            : ""
                        }


                        <button
                            class="btn btn-danger"
                            onclick="
                                deleteRequest(
                                    '${req.id}'
                                )
                            "
                        >

                            حذف 🗑️

                        </button>

                    </div>

                </td>

            </tr>

        `,
          )

          .join("");
      }

      /* =========================
   UPDATE
========================= */

      async function updateStatus(id, newStatus) {
        try {
          const { error } = await supabaseClient

            .from("requests")

            .update({
              status: newStatus,
            })

            .eq("id", id);

          if (error) throw error;

          fetchRequests();
        } catch (err) {
          alert("خطأ أثناء التحديث: " + err.message);
        }
      }

      /* =========================
   DELETE
========================= */

      async function deleteRequest(id) {
        if (!confirm("هل أنت متأكد من حذف هذا الطلب؟")) return;

        try {
          const { error } = await supabaseClient

            .from("requests")

            .delete()

            .eq("id", id);

          if (error) throw error;

          fetchRequests();
        } catch (err) {
          alert("خطأ أثناء الحذف: " + err.message);
        }
      }

      /* ENTER LOGIN */

      document
        .getElementById("password")
        .addEventListener("keydown", function (e) {
          if (e.key === "Enter") login();
        });

      /* START */

      document.addEventListener("DOMContentLoaded", checkSession);
     
    </script>
  </body>
</html>
