<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>اعتماد المزودين | Gulf Catering Hub</title><link rel="icon" href="../favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link rel="stylesheet" href="../assets/common.css"><style>.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.provider-grid{display:grid;gap:10px}.provider-card{padding:16px}.provider-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.doc{border:1px solid var(--line);padding:11px;border-radius:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.legal{display:grid;grid-template-columns:1fr 1fr;gap:8px}.legal div{border:1px solid var(--line);border-radius:10px;padding:9px}.legal small{display:block;color:var(--muted)}@media(max-width:800px){.cards,.doc-grid,.legal{grid-template-columns:1fr 1fr}}@media(max-width:520px){.cards,.doc-grid,.legal{grid-template-columns:1fr}}</style></head><body>
<header class="topbar"><div class="wrap"><nav><a class="brand" href="../"><img src="../apple-touch-icon.png" alt=""><span>Gulf Catering Hub — الإدارة</span></a><div class="nav-actions"><a class="ghost" href="./">العمليات</a><a class="ghost" href="./rfq.html">RFQ</a><a class="ghost" href="./finance.html">المالية</a><button class="ghost" onclick="logout()">خروج</button></div></nav></div></header>
<main class="app" style="display:block"><div class="wrap"><div class="hello"><div><h1>اعتماد شركاء الكيترنغ</h1><p>لا يتم تفعيل أي مزود قبل مراجعة البيانات القانونية والمستندات المطلوبة.</p></div><button class="ghost" onclick="loadAll()">تحديث</button></div><div class="cards"><div class="card"><small>إجمالي الطلبات</small><div class="metric" id="mAll">0</div></div><div class="card"><small>بانتظار مراجعة</small><div class="metric" id="mSubmitted">0</div></div><div class="card"><small>موثق قانونيًا</small><div class="metric" id="mVerified">0</div></div><div class="card"><small>مزودون فعالون</small><div class="metric" id="mApproved">0</div></div></div><div style="height:14px"></div><section class="section"><div class="toolbar"><h2>طلبات الانضمام</h2><select id="filter" onchange="render()"><option value="all">الكل</option><option value="submitted">مرسلة</option><option value="under_review">قيد المراجعة</option><option value="needs_changes">بحاجة تعديل</option><option value="verified">موثقة</option><option value="rejected">مرفوضة</option></select></div><div class="provider-grid" id="host"><div class="empty">جارٍ التحميل...</div></div><div class="msg" id="pageMsg"></div></section></div></main>
<div class="modal" id="detailModal"><div class="modalbox" style="width:min(1000px,95vw)"><div class="modalhead"><div><h2 id="dTitle">مراجعة مزود</h2><div class="muted" id="dStatus"></div></div><button class="close" onclick="GCH.closeModal('detailModal')">×</button></div><div id="details"></div><div class="msg" id="detailMsg"></div></div></div>
<script src="../assets/common.js"></script><script>
let rows=[],active=null,user=null;
const labels={commercial_registration:'السجل التجاري',trade_license:'الرخصة التجارية / النشاط',national_id:'هوية المفوض',bank_certificate:'شهادة البنك',email_declaration:'إقرار بريد/تفويض موقع',logo:'الشعار',cover_photo:'صورة الغلاف',vat_certificate:'شهادة VAT',power_of_attorney:'التفويض / الوكالة',trademark:'العلامة التجارية'};
async function logout(){await GCH.db.auth.signOut();location.href='./'}
async function boot(){const {data:{user:u}}=await GCH.db.auth.getUser();if(!u){location.href='./';return}user=u;const {data:p}=await GCH.db.from('user_profiles').select('role').eq('id',u.id).maybeSingle();if(p?.role!=='admin'){location.href='./';return}await loadAll()}
async function loadAll(){try{const {data,error}=await GCH.db.from('catering_providers').select('id,name,phone,status,accepting_marketplace_requests,created_at,provider_verifications(*)').order('created_at',{ascending:false});if(error)throw error;rows=data||[];document.getElementById('mAll').textContent=rows.length;document.getElementById('mSubmitted').textContent=rows.filter(x=>['submitted','under_review'].includes(x.provider_verifications?.[0]?.verification_status)).length;document.getElementById('mVerified').textContent=rows.filter(x=>x.provider_verifications?.[0]?.verification_status==='verified').length;document.getElementById('mApproved').textContent=rows.filter(x=>x.status==='approved').length;render()}catch(e){console.error(e);GCH.msg('pageMsg',GCH.genericError(e))}}
function render(){const f=document.getElementById('filter').value,xs=f==='all'?rows:rows.filter(x=>x.provider_verifications?.[0]?.verification_status===f);document.getElementById('host').innerHTML=xs.map(x=>{const v=x.provider_verifications?.[0],vs=v?.verification_status||'draft';return `<div class="card provider-card"><div class="provider-head"><div><b>${GCH.esc(x.name)}</b><div class="meta">${GCH.esc(x.phone||'')} · أُنشئ ${GCH.date(x.created_at)}</div><div class="meta">${v?GCH.esc(v.legal_name||'')+' · CR '+GCH.esc(v.commercial_registration_number||''):'لم يكمل التحقق القانوني'}</div></div><div class="actions"><span class="status st-${vs}">${statusLabel(vs)}</span><span class="status st-${x.status}">${x.status==='approved'?'فعال':x.status==='suspended'?'موقوف':'غير مفعل'}</span><button class="primary" onclick="openProvider('${x.id}')">مراجعة</button></div></div></div>`}).join('')||'<div class="empty">لا توجد طلبات ضمن هذا الفلتر.</div>'}
function statusLabel(s){return{draft:'مسودة',submitted:'مرسل',under_review:'قيد المراجعة',needs_changes:'بحاجة تعديلات',verified:'موثق',rejected:'مرفوض'}[s]||s}
async function openProvider(id){active=rows.find(x=>x.id===id);if(!active)return;const v=active.provider_verifications?.[0];const {data:docs,error}=await GCH.db.from('provider_documents').select('*').eq('provider_id',id).order('document_type');if(error)return GCH.msg('pageMsg',GCH.genericError(error));active.docs=docs||[];document.getElementById('dTitle').textContent='مراجعة — '+active.name;document.getElementById('dStatus').textContent=v?statusLabel(v.verification_status):'لم يبدأ التحقق';document.getElementById('details').innerHTML=v?detailHtml(v):'<div class="empty">المزود لم يرسل ملف التحقق القانوني بعد.</div>';GCH.clearMsg('detailMsg');GCH.openModal('detailModal')}
function detailHtml(v){const legal=[['الاسم القانوني',v.legal_name],['السجل التجاري',v.commercial_registration_number],['انتهاء CR',v.commercial_registration_expiry],['الرخصة',v.trade_license_number],['انتهاء الرخصة',v.trade_license_expiry],['المفوض',v.authorized_representative_name],['صفة المفوض',v.authorized_representative_role],['هوية المفوض',v.authorized_representative_id_number],['VAT',v.vat_registered?(v.vat_number||'مسجل'):'غير مسجل'],['البريد التجاري',v.business_email],['الهاتف التجاري',v.business_phone],['الموقع',`${v.governorate||''} / ${v.wilayat||''}`],['العنوان',v.business_address],['البنك',v.bank_name],['صاحب الحساب',v.bank_account_name],['IBAN',v.iban]];return `<div class="legal">${legal.map(([a,b])=>`<div><small>${a}</small><b>${GCH.esc(b||'—')}</b></div>`).join('')}</div><h3>المستندات</h3><div class="doc-grid">${Object.entries(labels).map(([t,l])=>docHtml(t,l)).join('')}</div><div class="field"><label>ملاحظات المراجعة</label><textarea id="reviewNotes">${GCH.esc(v.review_notes||'')}</textarea></div><div class="actions"><button class="ghost" onclick="setVerification('under_review')">بدء المراجعة</button><button class="ghost" onclick="setVerification('needs_changes')">طلب تعديلات</button><button class="danger" onclick="setVerification('rejected')">رفض الملف</button><button class="primary" onclick="setVerification('verified')">اعتماد التحقق القانوني</button>${v.verification_status==='verified'&&active.status!=='approved'?'<button class="primary" onclick="activateProvider()">تفعيل المزود في السوق</button>':''}${active.status==='approved'?'<button class="danger" onclick="suspendProvider()">إيقاف المزود</button>':''}</div>`}
function docHtml(type,label){const d=active.docs.find(x=>x.document_type===type);if(!d)return `<div class="doc"><b>${label}</b><div class="meta">غير مرفوع</div></div>`;return `<div class="doc"><div class="provider-head"><div><b>${label}</b><div class="meta">${GCH.esc(d.file_name)}</div></div><span class="status st-${d.status}">${d.status==='approved'?'معتمد':d.status==='rejected'?'مرفوض':'قيد المراجعة'}</span></div><div class="actions" style="margin-top:8px"><button class="ghost" onclick="viewDoc('${d.storage_path}')">فتح</button><button class="primary" onclick="reviewDoc('${d.id}','approved')">اعتماد</button><button class="danger" onclick="reviewDoc('${d.id}','rejected')">رفض</button></div>${d.review_notes?`<div class="meta">${GCH.esc(d.review_notes)}</div>`:''}</div>`}
async function viewDoc(path){try{const {data,error}=await GCH.db.storage.from('provider-documents').createSignedUrl(path,300);if(error)throw error;window.open(data.signedUrl,'_blank','noopener')}catch(e){GCH.msg('detailMsg',GCH.genericError(e))}}
async function reviewDoc(id,status){const notes=status==='rejected'?prompt('سبب رفض المستند:')||'المستند غير مقبول':null;try{const {error}=await GCH.db.from('provider_documents').update({status,review_notes:notes}).eq('id',id);if(error)throw error;await loadAll();await openProvider(active.id)}catch(e){GCH.msg('detailMsg',GCH.genericError(e))}}
async function setVerification(status){if(!active?.provider_verifications?.[0])return;const notes=document.getElementById('reviewNotes').value.trim();try{const {error}=await GCH.db.from('provider_verifications').update({verification_status:status,review_notes:notes||null}).eq('provider_id',active.id);if(error)throw error;GCH.msg('detailMsg',status==='verified'?'تم اعتماد التحقق القانوني. يمكنك الآن تفعيل المزود.':'تم تحديث حالة المراجعة.',true);await loadAll();await openProvider(active.id)}catch(e){console.error(e);GCH.msg('detailMsg',String(e?.message||'').includes('required documents')?'يجب اعتماد كل المستندات المطلوبة أولًا.':GCH.genericError(e))}}
async function activateProvider(){try{const {error}=await GCH.db.from('catering_providers').update({status:'approved',accepting_marketplace_requests:true}).eq('id',active.id);if(error)throw error;GCH.msg('detailMsg','تم تفعيل المزود وأصبح مؤهلاً لفرص السوق.',true);await loadAll();await openProvider(active.id)}catch(e){console.error(e);GCH.msg('detailMsg',GCH.genericError(e))}}
async function suspendProvider(){if(!confirm('إيقاف هذا المزود عن السوق؟'))return;try{const {error}=await GCH.db.from('catering_providers').update({status:'suspended',accepting_marketplace_requests:false}).eq('id',active.id);if(error)throw error;await loadAll();GCH.closeModal('detailModal')}catch(e){GCH.msg('detailMsg',GCH.genericError(e))}}
GCH.setupModal('detailModal');GCH.setupEscape();boot();
</script></body></html>
