<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>إدارة طلبات عروض الأسعار | Gulf Catering Hub</title>
<link rel="icon" href="../favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link rel="stylesheet" href="../assets/common.css">
<style>.ops{display:grid;gap:12px}.rfqbox{border:1px solid var(--line);border-radius:16px;padding:16px}.rfqhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.actions{display:flex;gap:7px;flex-wrap:wrap}.minirow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}.providerchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}@media(max-width:700px){.rfqhead,.minirow{display:grid;grid-template-columns:1fr}}</style>
</head><body>
<header class="topbar"><div class="wrap"><nav><a class="brand" href="../"><img src="../apple-touch-icon.png" alt=""><span>Gulf Catering Hub — الإدارة</span></a><div class="nav-actions"><a class="ghost" href="./">لوحة العمليات</a><button class="ghost" onclick="logout()">خروج</button></div></nav></div></header>
<main class="app" style="display:block"><div class="wrap"><div class="hello"><div><h1>إدارة طلبات عروض الأسعار</h1><p>مطابقة الطلبات مع المزودين، متابعة الدعوات والعروض، والتدخل عند الحاجة.</p></div><button class="ghost" onclick="loadAll()">تحديث</button></div>
<section class="section"><div class="toolbar"><h2>RFQ Pipeline</h2><span class="muted" id="stats">—</span></div><div class="ops" id="rfqHost"><div class="empty">جارٍ التحميل...</div></div></section><div class="msg" id="pageMsg"></div></div></main>
<script src="../assets/common.js"></script>
<script>
let rfqs=[],invites=[],quotes=[],providers=[];
const S={draft:'مسودة',open:'مفتوح',quotes_received:'وصلت عروض',selected:'تم اختيار عرض',closed:'مغلق',cancelled:'ملغي'};
async function logout(){await GCH.db.auth.signOut();location.href='./'}
async function boot(){const {data:{user}}=await GCH.db.auth.getUser();if(!user){location.href='./';return}const {data:p}=await GCH.db.from('user_profiles').select('role').eq('id',user.id).maybeSingle();if(!p||p.role!=='admin'){location.href='./';return}await loadAll()}
async function loadAll(){try{const [r,i,q,p]=await Promise.all([GCH.db.from('rfqs').select('*,companies(name),company_branches(name)').order('created_at',{ascending:false}).limit(100),GCH.db.from('rfq_provider_invites').select('*').order('invited_at',{ascending:false}).limit(500),GCH.db.from('provider_quotes').select('*').order('submitted_at',{ascending:false}).limit(500),GCH.db.from('catering_providers').select('id,name,status,service_areas,max_capacity,lead_time_hours').eq('status','approved').order('name')]);for(const x of [r,i,q,p])if(x.error)throw x.error;rfqs=r.data||[];invites=i.data||[];quotes=q.data||[];providers=p.data||[];render()}catch(e){console.error(e);document.getElementById('rfqHost').innerHTML='<div class="empty">تعذر تحميل الـRFQ.</div>'}}
function render(){document.getElementById('stats').textContent=`${GCH.number(rfqs.filter(x=>['open','quotes_received'].includes(x.status)).length)} مفتوح · ${GCH.number(quotes.filter(x=>x.status==='submitted').length)} عرض بانتظار قرار`;document.getElementById('rfqHost').innerHTML=rfqs.map(box).join('')||'<div class="empty">لا توجد طلبات عروض أسعار بعد.</div>'}
function box(r){const ins=invites.filter(x=>x.rfq_id===r.id),qs=quotes.filter(x=>x.rfq_id===r.id),submitted=qs.filter(x=>x.status==='submitted'),selected=qs.find(x=>x.status==='accepted'),names=ins.map(i=>providers.find(p=>p.id===i.provider_id)?.name||i.provider_id.slice(0,8));return `<div class="rfqbox"><div class="rfqhead"><div><b>${GCH.esc(r.companies?.name||'شركة')} — ${GCH.esc(r.title)}</b><div class="meta">${GCH.datetime(r.event_date)} · ${GCH.number(r.people_count||0)} شخص · ${GCH.esc(r.location)}<br>المهلة: ${GCH.datetime(r.quote_deadline)} · الميزانية: ${r.budget!=null?GCH.money(r.budget,'ar',1):'غير محددة'}<br>${GCH.esc(r.requirements?.notes||'')}</div></div><div class="actions"><span class="status st-${r.status}">${S[r.status]||r.status}</span>${['open','quotes_received'].includes(r.status)?`<button class="primary" onclick="autoMatch('${r.id}')">مطابقة تلقائية</button>`:''}${r.status==='selected'?`<button class="ghost" onclick="closeRfq('${r.id}')">إغلاق</button>`:''}</div></div><div class="minirow" style="margin-top:12px"><select id="manual-${r.id}"><option value="">دعوة مزود يدويًا</option>${providers.filter(p=>!ins.some(i=>i.provider_id===p.id)).map(p=>`<option value="${p.id}">${GCH.esc(p.name)}</option>`).join('')}</select><button class="ghost" onclick="manualInvite('${r.id}')">دعوة</button><span class="muted">${GCH.number(ins.length)} دعوات · ${GCH.number(submitted.length)} عروض${selected?` · المختار ${GCH.money(selected.total,'ar',1)}`:''}</span></div>${names.length?`<div class="providerchips">${names.map(n=>`<span class="status st-viewed">${GCH.esc(n)}</span>`).join('')}</div>`:''}</div>`}
async function autoMatch(id){try{const {data,error}=await GCH.db.rpc('match_rfq_providers',{p_rfq_id:id,p_limit:5});if(error)throw error;GCH.msg('pageMsg',data?`تمت دعوة ${GCH.number(data)} مزود/مزودين جدد.`:'لا يوجد مزود جديد مطابق حاليًا.',true);await loadAll()}catch(e){console.error(e);GCH.msg('pageMsg',GCH.genericError(e))}}
async function manualInvite(id){const provider_id=document.getElementById('manual-'+id).value;if(!provider_id)return GCH.msg('pageMsg','اختر مزودًا أولًا.');const r=rfqs.find(x=>x.id===id);try{const {error}=await GCH.db.from('rfq_provider_invites').insert({rfq_id:id,provider_id,match_score:0,expires_at:r.quote_deadline});if(error)throw error;GCH.msg('pageMsg','تم إرسال الدعوة للمزود.',true);await loadAll()}catch(e){console.error(e);GCH.msg('pageMsg',GCH.genericError(e))}}
async function closeRfq(id){try{const {error}=await GCH.db.from('rfqs').update({status:'closed'}).eq('id',id);if(error)throw error;await loadAll()}catch(e){GCH.msg('pageMsg',GCH.genericError(e))}}
boot();
</script></body></html>
