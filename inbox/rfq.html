<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>إدارة سوق عروض الأسعار | Gulf Catering Hub</title>
<link rel="icon" href="../favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link rel="stylesheet" href="../assets/common.css">
<style>.ops{display:grid;gap:12px}.rfqbox{border:1px solid var(--line);border-radius:16px;padding:16px}.rfqbox.attention{border-color:rgba(225,122,96,.55)}.rfqhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.actions{display:flex;gap:7px;flex-wrap:wrap}.minirow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}.providerchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.market-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:14px}.market-stats .metric{font-size:22px}.filterbar{display:flex;gap:6px;flex-wrap:wrap}.filterbar button.active{background:var(--gold);color:#111}.source-badge{display:inline-flex;padding:3px 8px;border-radius:999px;border:1px solid var(--line);font-size:9px;margin-top:5px}.source-badge.market{color:var(--gold2);border-color:rgba(201,164,92,.5)}.source-badge.private{color:#bfc8dc}.health{font-size:10px;margin-top:6px}.health.bad{color:#e79a84}.health.good{color:#9fd2a5}@media(max-width:950px){.market-stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.rfqhead,.minirow{display:grid;grid-template-columns:1fr}.market-stats{grid-template-columns:1fr 1fr}}</style>
</head><body>
<header class="topbar"><div class="wrap"><nav><a class="brand" href="../"><img src="../apple-touch-icon.png" alt=""><span>Gulf Catering Hub — الإدارة</span></a><div class="nav-actions"><a class="ghost" href="./">لوحة العمليات</a><a class="ghost" href="./finance.html">إيراد المنصة</a><button class="ghost" onclick="logout()">خروج</button></div></nav></div></header>
<main class="app" style="display:block"><div class="wrap"><div class="hello"><div><h1>Marketplace Liquidity</h1><p>راقب الطلب والعرض، سرعة وصول أول Quote، وتدخل فقط عندما يحتاج السوق دفعة.</p></div><button class="ghost" onclick="loadAll()">تحديث</button></div>
<section class="market-stats"><div class="card"><small>طلبات سوق مفتوحة</small><div class="metric" id="mMarketOpen">0</div></div><div class="card"><small>بدون أي عرض</small><div class="metric" id="mNoQuotes">0</div></div><div class="card"><small>متوسط عروض / طلب</small><div class="metric" id="mDepth">0</div></div><div class="card"><small>متوسط وقت أول عرض</small><div class="metric" id="mFirst">—</div></div><div class="card"><small>صفقات Marketplace مختارة</small><div class="metric" id="mSelected">0</div></div></section>
<section class="section"><div class="toolbar"><div><h2>RFQ Pipeline</h2><div class="filterbar" id="filterbar"><button class="ghost active" data-filter="all">الكل</button><button class="ghost" data-filter="marketplace">السوق المفتوح</button><button class="ghost" data-filter="invite_only">دعوات خاصة</button><button class="ghost" data-filter="attention">تحتاج تدخل</button></div></div><span class="muted" id="stats">—</span></div><div class="ops" id="rfqHost"><div class="empty">جارٍ التحميل...</div></div></section><div class="msg" id="pageMsg"></div></div></main>
<script src="../assets/common.js"></script>
<script>
let rfqs=[],invites=[],quotes=[],providers=[],activeFilter='all';
const S={draft:'مسودة',open:'مفتوح',quotes_received:'وصلت عروض',selected:'تم اختيار عرض',closed:'مغلق',cancelled:'ملغي'};
async function logout(){await GCH.db.auth.signOut();location.href='./'}
async function boot(){const {data:{user}}=await GCH.db.auth.getUser();if(!user){location.href='./';return}const {data:p}=await GCH.db.from('user_profiles').select('role').eq('id',user.id).maybeSingle();if(!p||p.role!=='admin'){location.href='./';return}document.getElementById('filterbar').onclick=e=>{const f=e.target.dataset.filter;if(!f)return;activeFilter=f;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter===f));render()};await loadAll()}
async function loadAll(){try{const [r,i,q,p]=await Promise.all([GCH.db.from('rfqs').select('*,companies(name),company_branches(name)').order('created_at',{ascending:false}).limit(200),GCH.db.from('rfq_provider_invites').select('*').order('invited_at',{ascending:false}).limit(1000),GCH.db.from('provider_quotes').select('*').order('submitted_at',{ascending:false}).limit(1000),GCH.db.from('catering_providers').select('id,name,status,service_areas,max_capacity,lead_time_hours').eq('status','approved').order('name')]);for(const x of [r,i,q,p])if(x.error)throw x.error;rfqs=r.data||[];invites=i.data||[];quotes=q.data||[];providers=p.data||[];render()}catch(e){console.error(e);document.getElementById('rfqHost').innerHTML='<div class="empty">تعذر تحميل الـRFQ.</div>'}}
function visibleQuotes(id){return quotes.filter(x=>x.rfq_id===id&&['submitted','accepted','rejected','expired'].includes(x.status))}
function firstQuoteHours(r){const qs=visibleQuotes(r.id).filter(x=>x.submitted_at).sort((a,b)=>new Date(a.submitted_at)-new Date(b.submitted_at));if(!qs.length)return null;return Math.max(0,(new Date(qs[0].submitted_at)-new Date(r.created_at))/3600000)}
function ageHours(r){return Math.max(0,(Date.now()-new Date(r.created_at).getTime())/3600000)}
function needsAttention(r){return r.sourcing_mode==='marketplace'&&['open','quotes_received'].includes(r.status)&&visibleQuotes(r.id).length===0&&ageHours(r)>=2}
function filtered(){return rfqs.filter(r=>activeFilter==='all'||activeFilter==='attention'&&needsAttention(r)||activeFilter==='marketplace'&&r.sourcing_mode==='marketplace'||activeFilter==='invite_only'&&r.sourcing_mode!=='marketplace')}
function fmtHours(v){if(v==null)return '—';if(v<1)return Math.max(1,Math.round(v*60))+' د';if(v<24)return v.toFixed(v<10?1:0)+' س';return (v/24).toFixed(1)+' ي'}
function render(){const market=rfqs.filter(r=>r.sourcing_mode==='marketplace'),marketOpen=market.filter(r=>['open','quotes_received'].includes(r.status)),noQuotes=marketOpen.filter(r=>visibleQuotes(r.id).length===0),depthBase=market.filter(r=>['open','quotes_received','selected','closed'].includes(r.status)),depth=depthBase.length?depthBase.reduce((s,r)=>s+visibleQuotes(r.id).length,0)/depthBase.length:0,firsts=market.map(firstQuoteHours).filter(v=>v!=null),avgFirst=firsts.length?firsts.reduce((a,b)=>a+b,0)/firsts.length:null,selected=market.filter(r=>r.status==='selected'||visibleQuotes(r.id).some(q=>q.status==='accepted'));document.getElementById('mMarketOpen').textContent=GCH.number(marketOpen.length);document.getElementById('mNoQuotes').textContent=GCH.number(noQuotes.length);document.getElementById('mDepth').textContent=depth.toFixed(1);document.getElementById('mFirst').textContent=fmtHours(avgFirst);document.getElementById('mSelected').textContent=GCH.number(selected.length);const rows=filtered();document.getElementById('stats').textContent=`${GCH.number(rows.length)} طلب · ${GCH.number(quotes.filter(x=>x.status==='submitted').length)} عرض بانتظار قرار`;document.getElementById('rfqHost').innerHTML=rows.map(box).join('')||'<div class="empty">لا توجد طلبات ضمن هذا الفلتر.</div>'}
function box(r){const ins=invites.filter(x=>x.rfq_id===r.id),qs=visibleQuotes(r.id),submitted=qs.filter(x=>x.status==='submitted'),selected=qs.find(x=>x.status==='accepted'),names=ins.map(i=>providers.find(p=>p.id===i.provider_id)?.name||i.provider_id.slice(0,8)),market=r.sourcing_mode==='marketplace',first=firstQuoteHours(r),attention=needsAttention(r),age=ageHours(r);return `<div class="rfqbox ${attention?'attention':''}"><div class="rfqhead"><div><b>${GCH.esc(r.companies?.name||'شركة')} — ${GCH.esc(r.title)}</b><div class="source-badge ${market?'market':'private'}">${market?'Marketplace مفتوح':'Invite only'}</div><div class="meta">${GCH.datetime(r.event_date)} · ${GCH.number(r.people_count||0)} شخص · ${GCH.esc(r.location)}<br>المهلة: ${GCH.datetime(r.quote_deadline)} · الميزانية: ${r.budget!=null?GCH.money(r.budget,'ar',1):'غير محددة'}<br>${GCH.esc(r.requirements?.notes||'')}</div><div class="health ${attention?'bad':qs.length?'good':''}">${qs.length?`أول عرض خلال ${fmtHours(first)} · عمق السوق ${GCH.number(qs.length)} عرض`:attention?`بدون عروض منذ ${fmtHours(age)} — يحتاج تدخل`:`بانتظار أول عرض · منشور منذ ${fmtHours(age)}`}</div></div><div class="actions"><span class="status st-${r.status}">${S[r.status]||r.status}</span>${['open','quotes_received'].includes(r.status)?`<button class="${attention?'primary':'ghost'}" onclick="autoMatch('${r.id}')">${market?'دعوة مزودين مطابقين':'مطابقة تلقائية'}</button>`:''}${r.status==='selected'?`<button class="ghost" onclick="closeRfq('${r.id}')">إغلاق</button>`:''}</div></div><div class="minirow" style="margin-top:12px"><select id="manual-${r.id}"><option value="">دعوة مزود يدويًا</option>${providers.filter(p=>!ins.some(i=>i.provider_id===p.id)).map(p=>`<option value="${p.id}">${GCH.esc(p.name)}</option>`).join('')}</select><button class="ghost" onclick="manualInvite('${r.id}')">دعوة</button><span class="muted">${GCH.number(ins.length)} دعوات خاصة · ${GCH.number(submitted.length)} عروض فعالة${selected?` · المختار ${GCH.money(selected.total,'ar',1)}`:''}</span></div>${names.length?`<div class="providerchips">${names.map(n=>`<span class="status st-viewed">${GCH.esc(n)}</span>`).join('')}</div>`:''}</div>`}
async function autoMatch(id){try{const {data,error}=await GCH.db.rpc('match_rfq_providers',{p_rfq_id:id,p_limit:5});if(error)throw error;GCH.msg('pageMsg',data?`تمت دعوة ${GCH.number(data)} مزود/مزودين مطابقين.`:'لا يوجد مزود جديد مطابق حاليًا.',true);await loadAll()}catch(e){console.error(e);GCH.msg('pageMsg',GCH.genericError(e))}}
async function manualInvite(id){const provider_id=document.getElementById('manual-'+id).value;if(!provider_id)return GCH.msg('pageMsg','اختر مزودًا أولًا.');const r=rfqs.find(x=>x.id===id);try{const {error}=await GCH.db.from('rfq_provider_invites').insert({rfq_id:id,provider_id,match_score:0,expires_at:r.quote_deadline});if(error)throw error;GCH.msg('pageMsg','تم إرسال الدعوة للمزود.',true);await loadAll()}catch(e){console.error(e);GCH.msg('pageMsg',GCH.genericError(e))}}
async function closeRfq(id){try{const {error}=await GCH.db.from('rfqs').update({status:'closed'}).eq('id',id);if(error)throw error;await loadAll()}catch(e){GCH.msg('pageMsg',GCH.genericError(e))}}
boot();
</script></body></html>
