<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>فواتير المزود | Gulf Catering Hub</title>
<link rel="icon" href="../favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link rel="stylesheet" href="../assets/common.css">
<style>.finance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.layout2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:800px){.layout2{grid-template-columns:1fr}.finance-grid{grid-template-columns:1fr}}</style></head><body>
<header class="topbar"><div class="wrap"><nav><a class="brand" href="../"><img src="../apple-touch-icon.png" alt=""><span>Gulf Catering Hub</span></a><div class="nav-actions"><a class="ghost" href="./">بوابة المزود</a><a class="ghost" href="./rfq.html">عروض الأسعار</a><a class="ghost" href="./performance.html">الأداء وSLA</a><a class="ghost" href="./activity.html">الإشعارات</a><button class="ghost" onclick="logout()">خروج</button></div></nav></div></header>
<main class="app" style="display:block"><div class="wrap"><div class="hello"><div><h1>أوامر الشراء والفواتير</h1><p>استلم PO، أصدر فاتورتك، وتابع حالة الدفع.</p></div><span class="status" id="providerStatus">فحص الحساب...</span></div>
<section class="finance-grid"><div class="card"><small>أوامر شراء</small><div class="metric" id="mPO">0</div></div><div class="card"><small>قيمة الفواتير</small><div class="metric" id="mInv">0</div></div><div class="card"><small>تم استلامه</small><div class="metric" id="mPaid">0</div></div></section><div style="height:14px"></div>
<div class="layout2"><div><section class="section"><div class="toolbar"><h2>أوامر الشراء</h2><button class="ghost" onclick="loadAll()">تحديث</button></div><div class="list" id="poList"></div></section><section class="section"><h2>فواتيري</h2><div class="list" id="invoiceList"></div></section></div>
<aside><section class="section"><h2>إصدار فاتورة</h2><div class="field"><label>الطلب *</label><select id="invOrder" onchange="orderChanged()"></select></div><div class="field"><label>رقم الفاتورة *</label><input id="invNumber"></div><div class="grid2"><div class="field"><label>المبلغ *</label><input id="invAmount" type="number" min=".001" step=".001"></div><div class="field"><label>تاريخ الفاتورة</label><input id="invDate" type="date"></div></div><div class="field"><label>أمر الشراء المرتبط</label><select id="invPO"></select></div><div class="field"><label>ملاحظات</label><textarea id="invNotes"></textarea></div><button class="primary" id="invBtn" style="width:100%" onclick="createInvoice()">إرسال الفاتورة</button><div class="msg" id="invMsg"></div></section><section class="section"><h2>الدفعات المستلمة</h2><div class="list" id="paymentList"></div></section></aside></div></div></main>
<script src="../assets/common.js"></script><script src="./finance.js"></script></body></html>
