<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>تنفيذ الطلبات | Gulf Catering Hub</title><link rel="icon" href="../favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link rel="stylesheet" href="../assets/common.css"><style>.tracking{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.step{font-size:9px;padding:5px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}.step.active{border-color:rgba(201,164,92,.55);color:var(--gold2)}.step.done{border-color:rgba(77,190,120,.4);color:#9dd7ae}.actions{display:flex;gap:6px;flex-wrap:wrap}.nextbox{margin-top:9px;padding:10px;border:1px solid var(--line);border-radius:12px}.nextbox textarea{margin-top:7px}</style></head><body><header class="topbar"><div class="wrap"><nav><a class="brand" href="../"><img src="../apple-touch-icon.png" alt=""><span>Gulf Catering Hub — الشركاء</span></a><div class="nav-actions"><a class="ghost" href="./">بوابة الشريك</a><a class="ghost" href="./rfq.html">فرص السوق</a><a class="ghost" href="../support.html">الدعم</a><button class="ghost" onclick="logout()">خروج</button></div></nav></div></header><main class="app" style="display:block"><div class="wrap"><div class="hello"><div><h1>تنفيذ الطلبات</h1><p>حدّث حالة الطلب لتبقى الشركة على اطلاع من التأكيد حتى التسليم.</p></div><button class="ghost" onclick="loadAll()">تحديث</button></div><section class="section"><div class="list" id="orders"><div class="empty">جارٍ التحميل...</div></div><div class="msg" id="pageMsg"></div></section></div></main><script src="../assets/common.js"></script><script>
let user=null,provider=null,orders=[];const stages=['scheduled','confirmed','preparing','ready','out_for_delivery','arrived','delivered'];const L={scheduled:'مجدول',confirmed:'تم التأكيد',preparing:'قيد التجهيز',ready:'جاهز',out_for_delivery:'خرج للتسليم',arrived:'وصل للموقع',delivered:'تم التسليم',issue_reported:'مشكلة مبلّغ عنها'};
async function logout(){await GCH.db.auth.signOut();location.href='./'}
async function boot(){const {data:{user:u}}=await GCH.db.auth.getUser();if(!u){location.href='./';return}user=u;const {data:p}=await GCH.db.from('user_profiles').select('role').eq('id',u.id).maybeSingle();if(!p||!['provider','admin'].includes(p.role)){location.href='./';return}const {data:pv,error}=await GCH.db.from('catering_providers').select('id,status').eq('owner_user_id',u.id).maybeSingle();if(error||!pv){location.href='./';return}provider=pv;await loadAll()}
async function loadAll(){const {data,error}=await GCH.db.from('company_orders').select('*').eq('provider_id',provider.id).order('event_date',{ascending:false});if(error)return GCH.msg('pageMsg',GCH.genericError(error));orders=data||[];render()}
function nextStatus(o){const s=o.fulfillment_status||'scheduled';if(s==='scheduled')return'confirmed';if(s==='confirmed')return'preparing';if(s==='preparing')return'ready';if(s==='ready')return'out_for_delivery';if(s==='out_for_delivery')return'arrived';if(s==='arrived')return'delivered';return null}
function render(){document.getElementById('orders').innerHTML=orders.map(o=>{const cur=o.fulfillment_status||'scheduled',idx=stages.indexOf(cur),next=nextStatus(o),eligible=['provider_accepted','completed'].includes(o.status);return `<div class="item"><div style="flex:1"><b>${GCH.esc(o.company_name_snapshot||'شركة')} — ${GCH.esc(o.order_type)}</b><div class="meta">${GCH.datetime(o.event_date)} · ${GCH.number(o.people_count||0)} شخص · ${GCH.esc(o.branch_name_snapshot||'')} ${o.branch_city_snapshot?'· '+GCH.esc(o.branch_city_snapshot):''}<br>${o.fulfillment_note?GCH.esc(o.fulfillment_note):''}</div><div class="tracking">${stages.map((s,i)=>`<span class="step ${cur==='issue_reported'?'':i<idx?'done':i===idx?'active':''}">${L[s]}</span>`).join('')}${cur==='issue_reported'?'<span class="step active">مشكلة مبلّغ عنها</span>':''}</div>${eligible&&next?`<div class="nextbox"><b>الخطوة التالية: ${L[next]}</b><textarea id="note-${o.id}" placeholder="ملاحظة للشركة (اختياري)"></textarea><div class="actions"><button class="primary" onclick="advance('${o.id}','${next}')">تحديث إلى ${L[next]}</button><button class="danger" onclick="issue('${o.id}')">إبلاغ عن مشكلة</button></div></div>`:''}</div><div><span class="status st-${o.status}">${o.status==='provider_accepted'?'مقبول':o.status==='completed'?'مكتمل':o.status==='cancelled'?'ملغي':o.status}</span></div></div>`}).join('')||'<div class="empty">لا توجد طلبات مسندة حاليًا.</div>'}
async function advance(id,status){const note=document.getElementById('note-'+id)?.value.trim()||null;try{const {error}=await GCH.db.rpc('update_order_fulfillment',{p_order_id:id,p_status:status,p_note:note});if(error)throw error;if(status==='delivered'){const {error:ce}=await GCH.db.from('company_orders').update({status:'completed',completed_at:new Date().toISOString()}).eq('id',id);if(ce)throw ce}await loadAll()}catch(e){console.error(e);GCH.msg('pageMsg',GCH.genericError(e))}}
async function issue(id){const note=prompt('صف المشكلة باختصار:');if(!note?.trim())return;try{const {error}=await GCH.db.rpc('update_order_fulfillment',{p_order_id:id,p_status:'issue_reported',p_note:note.trim()});if(error)throw error;const {data:t,error:te}=await GCH.db.from('support_tickets').insert({category:'order',priority:'high',subject:'مشكلة في تنفيذ الطلب',order_id:id}).select().single();if(te)throw te;await GCH.db.from('support_messages').insert({ticket_id:t.id,message:note.trim(),sender_role:'provider'});location.href='../support.html'}catch(e){console.error(e);GCH.msg('pageMsg',GCH.genericError(e))}}
boot();
</script></body></html>
