<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>أداء المزود | Gulf Catering Hub</title>
<link rel="icon" href="../favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link rel="stylesheet" href="../assets/common.css">
<style>.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.score{font-size:32px;font-weight:900}.schedule-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions{display:flex;gap:6px;flex-wrap:wrap}.review{padding:13px;border:1px solid var(--line);border-radius:14px}.stars{letter-spacing:2px}@media(max-width:900px){.metrics{grid-template-columns:1fr 1fr}.schedule-grid{grid-template-columns:1fr}}@media(max-width:550px){.metrics{grid-template-columns:1fr}}</style></head><body>
<header class="topbar"><div class="wrap"><nav><a class="brand" href="../"><img src="../apple-touch-icon.png" alt=""><span>Gulf Catering Hub</span></a><div class="nav-actions"><a class="ghost" href="./">بوابة المزود</a><a class="ghost" href="./rfq.html">عروض الأسعار</a><a class="ghost" href="./finance.html">الفواتير والـPO</a><button class="ghost" onclick="logout()">خروج</button></div></nav></div></header>
<main class="app" style="display:block"><div class="wrap"><div class="hello"><div><h1>الأداء وSLA</h1><p id="providerName">التقييمات، سرعة الاستجابة، القبول والالتزام بالتسليم.</p></div><button class="ghost" onclick="loadAll()">تحديث</button></div>
<section class="metrics"><div class="card"><small>Performance Score</small><div class="score" id="mScore">—</div></div><div class="card"><small>متوسط التقييم</small><div class="metric" id="mRating">—</div></div><div class="card"><small>نسبة القبول</small><div class="metric" id="mAccept">—</div></div><div class="card"><small>في الوقت</small><div class="metric" id="mOnTime">—</div></div><div class="card"><small>متوسط الرد</small><div class="metric" id="mResponse">—</div></div></section><div style="height:14px"></div>
<div class="schedule-grid"><section class="section"><div class="toolbar"><h2>جدول وجبات الموظفين</h2><button class="ghost" onclick="generateMeals()">تحديث 45 يوم</button></div><div class="list" id="mealList"></div></section><section class="section"><div class="toolbar"><h2>مراجعات الشركات</h2><span class="muted small" id="reviewCount"></span></div><div class="list" id="reviewList"></div></section></div>
</div></main>
<div class="modal" id="deliveryModal" role="dialog" aria-modal="true" aria-hidden="true"><div class="modalbox"><div class="modalhead"><h2>تأكيد التسليم</h2><button class="close" onclick="GCH.closeModal('deliveryModal')">×</button></div><p id="deliveryTitle" class="muted"></p><div class="field"><label>ملاحظة التسليم</label><textarea id="deliveryNotes" placeholder="تم التسليم إلى الاستقبال... أو ملاحظة تشغيلية"></textarea></div><button class="primary" id="deliveryBtn" style="width:100%" onclick="markDelivered()">تم التسليم</button><div class="msg" id="deliveryMsg"></div></div></div>
<script src="../assets/common.js"></script><script src="./performance.js"></script></body></html>
