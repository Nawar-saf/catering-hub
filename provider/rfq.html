<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>طلبات عروض الأسعار للمزود | Gulf Catering Hub</title>
<link rel="icon" href="../favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link rel="stylesheet" href="../assets/common.css">
<style>.quote-form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.totalbox{padding:14px;border:1px solid var(--line);border-radius:14px;display:flex;justify-content:space-between;align-items:center}.totalbox b{font-size:22px}.rfq-actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:650px){.quote-form-grid{grid-template-columns:1fr}}</style>
</head><body>
<header class="topbar"><div class="wrap"><nav><a class="brand" href="../"><img src="../apple-touch-icon.png" alt=""><span>Gulf Catering Hub</span></a><div class="nav-actions"><a class="ghost" href="./">بوابة المزود</a><button class="ghost" onclick="logout()">خروج</button></div></nav></div></header>
<main class="app" style="display:block"><div class="wrap"><div class="hello"><div><h1>طلبات عروض الأسعار</h1><p>الطلبات المطابقة لخدماتك. قدّم عرضك التجاري من نفس الصفحة.</p></div><span class="status" id="providerStatus">فحص الحساب...</span></div>
<section class="section"><div class="toolbar"><h2>الدعوات والطلبات</h2><button class="ghost" onclick="loadAll()">تحديث</button></div><div class="list" id="inviteList"><div class="empty">جارٍ التحميل...</div></div></section><div class="msg" id="pageMsg"></div></div></main>
<div class="modal" id="quoteModal" role="dialog" aria-modal="true" aria-hidden="true"><div class="modalbox"><div class="modalhead"><div><h2 id="quoteTitle">إرسال عرض</h2><div class="muted" id="quoteMeta"></div></div><button class="close" onclick="GCH.closeModal('quoteModal')">×</button></div>
<div class="quote-form-grid"><div class="field"><label>قيمة الطعام / الخدمة *</label><input id="qSubtotal" type="number" min="0" step=".1" oninput="calcTotal()"></div><div class="field"><label>التوصيل</label><input id="qDelivery" type="number" min="0" step=".1" value="0" oninput="calcTotal()"></div><div class="field"><label>خدمة / تجهيز</label><input id="qService" type="number" min="0" step=".1" value="0" oninput="calcTotal()"></div><div class="field"><label>الضريبة</label><input id="qVat" type="number" min="0" step=".1" value="0" oninput="calcTotal()"></div><div class="field"><label>الخصم</label><input id="qDiscount" type="number" min="0" step=".1" value="0" oninput="calcTotal()"></div><div class="field"><label>صالح حتى *</label><input id="qValid" type="datetime-local"></div></div>
<div class="totalbox"><span>الإجمالي</span><b id="qTotal">0 ر.ع</b></div>
<div class="field"><label>القائمة / العناصر *</label><textarea id="qMenu" placeholder="كل عنصر في سطر"></textarea></div><div class="field"><label>يشمل</label><textarea id="qIncludes" placeholder="التقديم، الطاولات، العمالة..."></textarea></div><div class="field"><label>لا يشمل</label><textarea id="qExcludes"></textarea></div><div class="field"><label>ملاحظات</label><textarea id="qNotes"></textarea></div>
<div class="rfq-actions"><button class="ghost" id="draftBtn" onclick="saveQuote(false)">حفظ مسودة</button><button class="primary" id="submitBtn" onclick="saveQuote(true)">إرسال العرض</button></div><div class="msg" id="quoteMsg"></div></div></div>
<script src="../assets/common.js"></script>
<script>
let user=null,provider=null,invites=[],quotes=[],activeInvite=null;
async function logout(){await GCH.db.auth.signOut();location.href='./'}
async function boot(){const {data:{user:u}}=await GCH.db.auth.getUser();if(!u){location.href='./';return}user=u;const {data:p}=await GCH.db.from('user_profiles').select('role').eq('id',u.id).maybeSingle();if(!p||!['provider','admin'].includes(p.role)){location.href='./';return}const {data:pv,error}=await GCH.db.from('catering_providers').select('*').eq('owner_user_id',u.id).maybeSingle();if(error||!pv){document.getElementById('providerStatus').textContent='أكمل ملف المزود أولًا';document.getElementById('inviteList').innerHTML='<div class="empty">ارجع لبوابة المزود وأكمل بيانات الشركة.</div>';return}provider=pv;document.getElementById('providerStatus').textContent=pv.status==='approved'?'مزود معتمد':'الملف بانتظار الاعتماد';document.getElementById('providerStatus').className='status '+(pv.status==='approved'?'st-approved':'st-pending');await loadAll()}
async function loadAll(){if(!provider)return;try{const [i,q]=await Promise.all([GCH.db.from('rfq_provider_invites').select('*,rfqs(*)').eq('provider_id',provider.id).order('invited_at',{ascending:false}),GCH.db.from('provider_quotes').select('*').eq('provider_id',provider.id).order('updated_at',{ascending:false})]);if(i.error)throw i.error;if(q.error)throw q.error;invites=i.data||[];quotes=q.data||[];render()}catch(e){console.error(e);document.getElementById('inviteList').innerHTML='<div class="empty">تعذر تحميل طلبات عروض الأسعار.</div>'}}
function render(){document.getElementById('inviteList').innerHTML=invites.map(card).join('')||'<div class="empty">لا توجد دعوات عروض أسعار حاليًا.</div>'}
function card(i){const r=i.rfqs||{},q=quotes.find(x=>x.rfq_id===i.rfq_id),locked=['selected','closed','cancelled'].includes(r.status)||['selected','expired'].includes(i.status);return `<div class="item"><div><b>${GCH.esc(r.title||'طلب عرض أسعار')}</b><div class="meta">${GCH.datetime(r.event_date)} · ${GCH.number(r.people_count||0)} شخص · ${GCH.esc(r.location||'')}<br>الميزانية: ${r.budget!=null?GCH.money(r.budget,'ar',1):'غير محددة'} · آخر موعد: ${GCH.datetime(r.quote_deadline)}<br>${GCH.esc(r.requirements?.notes||'')}</div></div><div class="rfq-actions"><span class="status st-${i.status}">${{invited:'دعوة جديدة',viewed:'تم الاطلاع',quoted:'تم إرسال عرض',declined:'مرفوض',expired:'انتهى',selected:'تم اختيارك'}[i.status]||i.status}</span>${q?`<span class="status st-${q.status}">${q.status==='submitted'?GCH.money(q.total,'ar',Number(q.total)%1?1:0):q.status}</span>`:''}${!locked&&i.status!=='declined'?`<button class="primary" onclick="openQuote('${i.id}')">${q?'تعديل العرض':'تقديم عرض'}</button>`:''}${!q&&!locked&&['invited','viewed'].includes(i.status)?`<button class="danger" onclick="declineInvite('${i.id}')">اعتذار</button>`:''}</div></div>`}
async function openQuote(inviteId){activeInvite=invites.find(x=>x.id===inviteId);if(!activeInvite)return;if(activeInvite.status==='invited')await GCH.db.from('rfq_provider_invites').update({status:'viewed'}).eq('id',inviteId);const r=activeInvite.rfqs,q=quotes.find(x=>x.rfq_id===activeInvite.rfq_id);document.getElementById('quoteTitle').textContent=q?'تعديل العرض — '+r.title:'عرض جديد — '+r.title;document.getElementById('quoteMeta').textContent=`${GCH.number(r.people_count||0)} شخص · ${GCH.datetime(r.event_date)} · ${r.location}`;document.getElementById('quoteTitle').textContent=q?'تعديل العرض — '+r.title:'عرض جديد — '+r.title;document.getElementById('quoteMeta').textContent=`${GCH.number(r.people_count||0)} شخص · ${GCH.datetime(r.event_date)} · ${r.location}`;document.getElementById('qSubtotal').value=q?.subtotal??'';document.getElementById('qDelivery').value=q?.delivery_fee??0;document.getElementById('qService').value=q?.service_fee??0;document.getElementById('qVat').value=q?.vat_amount??0;document.getElementById('qDiscount').value=q?.discount??0;document.getElementById('qMenu').value=(Array.isArray(q?.menu)?q.menu:[]).map(x=>typeof x==='string'?x:(x.name||'')).join('\n');document.getElementById('qIncludes').value=q?.inclusions||'';document.getElementById('qExcludes').value=q?.exclusions||'';document.getElementById('qNotes').value=q?.notes||'';const vd=q?.valid_until?new Date(q.valid_until):new Date(Math.min(new Date(r.quote_deadline).getTime(),Date.now()+7*86400000));vd.setMinutes(vd.getMinutes()-vd.getTimezoneOffset());document.getElementById('qValid').value=vd.toISOString().slice(0,16);calcTotal();GCH.clearMsg('quoteMsg');GCH.openModal('quoteModal');await loadAll()}
function calcTotal(){const n=id=>Math.max(0,Number(document.getElementById(id).value||0)),total=Math.max(0,n('qSubtotal')+n('qDelivery')+n('qService')+n('qVat')-n('qDiscount'));document.getElementById('qTotal').textContent=GCH.money(total,'ar',total%1?1:0)}
async function saveQuote(submit){if(!activeInvite)return;const n=id=>Number(document.getElementById(id).value||0),subtotal=n('qSubtotal'),delivery=n('qDelivery'),service=n('qService'),vat=n('qVat'),discount=n('qDiscount'),menu=document.getElementById('qMenu').value.split('\n').map(x=>x.trim()).filter(Boolean),valid=document.getElementById('qValid').value,btn=document.getElementById(submit?'submitBtn':'draftBtn');if(subtotal<0||delivery<0||service<0||vat<0||discount<0||discount>subtotal+delivery+service+vat||!menu.length||!valid)return GCH.msg('quoteMsg','تحقق من الأسعار والقائمة وتاريخ صلاحية العرض.');const payload={rfq_id:activeInvite.rfq_id,provider_id:provider.id,currency:'OMR',subtotal,delivery_fee:delivery,service_fee:service,vat_amount:vat,discount,menu,inclusions:document.getElementById('qIncludes').value.trim(),exclusions:document.getElementById('qExcludes').value.trim(),notes:document.getElementById('qNotes').value.trim(),valid_until:new Date(valid).toISOString(),status:submit?'submitted':'draft'};GCH.setBusy(btn,true);try{const old=quotes.find(x=>x.rfq_id===activeInvite.rfq_id);const res=old?await GCH.db.from('provider_quotes').update(payload).eq('id',old.id):await GCH.db.from('provider_quotes').insert(payload);if(res.error)throw res.error;GCH.msg('quoteMsg',submit?'تم إرسال العرض للشركة.':'تم حفظ المسودة.',true);await loadAll();setTimeout(()=>GCH.closeModal('quoteModal'),800)}catch(e){console.error(e);GCH.msg('quoteMsg',GCH.genericError(e))}finally{GCH.setBusy(btn,false)}}
async function declineInvite(id){if(!confirm('تأكيد الاعتذار عن هذا الطلب؟'))return;try{const {error}=await GCH.db.from('rfq_provider_invites').update({status:'declined'}).eq('id',id);if(error)throw error;await loadAll()}catch(e){GCH.msg('pageMsg',GCH.genericError(e))}}
GCH.setupModal('quoteModal');GCH.setupEscape();boot();
</script></body></html>
