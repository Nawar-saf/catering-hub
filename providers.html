<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مزودو الكيترنغ المعتمدون | Gulf Catering Hub</title>
<meta name="description" content="استعرض مزودي الكيترنغ المعتمدين، مناطق الخدمة، أنواع المطابخ، السعة والباقات ثم انشر طلب شركتك لاستقبال عروض الأسعار.">
<link rel="canonical" href="https://www.gulfcateringhub.com/providers.html">
<meta property="og:type" content="website"><meta property="og:url" content="https://www.gulfcateringhub.com/providers.html"><meta property="og:title" content="مزودو الكيترنغ | Gulf Catering Hub"><meta property="og:description" content="Approved corporate catering providers in one marketplace.">
<link rel="icon" href="./favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link rel="stylesheet" href="./assets/common.css">
<style>.hero{padding:58px 0 28px}.hero h1{font-size:clamp(34px,5vw,54px);margin:8px 0}.lead{color:var(--muted);max-width:760px;line-height:1.8}.filters{display:grid;grid-template-columns:1.5fr .75fr .75fr;gap:8px;margin:18px 0}.providers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.provider-card{display:flex;flex-direction:column;overflow:hidden;min-height:360px}.provider-cover{height:120px;background:linear-gradient(145deg,#1b1710,#0c0b09) center/cover no-repeat;position:relative;border-bottom:1px solid var(--line)}.provider-logo{position:absolute;right:16px;bottom:-28px;width:62px;height:62px;border-radius:16px;object-fit:cover;background:#111;border:3px solid var(--panel)}.provider-body{padding:38px 20px 20px;display:flex;flex-direction:column;flex:1}.provider-card h2{font-size:21px;margin:6px 0 2px}.rating{color:var(--gold2);font-weight:800}.availability{margin-top:7px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{font-size:9px;padding:5px 8px;border-radius:999px;border:1px solid var(--line);color:#d4ccbf}.provider-meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:14px 0}.mini-card{padding:10px;border:1px solid var(--line);border-radius:12px;background:#0e0d0a}.mini-card b{display:block}.mini-card span{font-size:9px;color:var(--muted)}.provider-card .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}.empty-market{text-align:center;padding:42px 24px}.empty-market h2{margin-top:0}.empty-market p{color:var(--muted);line-height:1.8}.count{font-size:11px;color:var(--muted);margin-bottom:12px}@media(max-width:950px){.providers{grid-template-columns:1fr 1fr}}@media(max-width:650px){.filters,.providers{grid-template-columns:1fr}}</style>
</head><body>
<header class="topbar"><div class="wrap"><nav><a class="brand" href="./"><img src="./apple-touch-icon.png" alt=""><span>Gulf Catering Hub</span></a><div class="nav-actions"><a class="ghost" href="./marketplace.html">السوق</a><a class="primary" href="./company/?next=rfq">انشر طلب شركة</a></div></nav></div></header>
<main><section class="hero"><div class="wrap"><span class="eyebrow">Approved Providers</span><h1>مزودو الكيترنغ المعتمدون</h1><p class="lead">استعرض مزودين موثقين، قارن قدراتهم وباقاتهم، وانشر طلبًا عامًا أو أرسل دعوة عرض سعر مباشرة لمزود بعينه.</p><div class="filters"><input id="q" placeholder="ابحث باسم المزود أو المنطقة أو المطبخ" oninput="render()"><select id="area" onchange="render()"><option value="">كل المناطق</option></select><select id="cuisine" onchange="render()"><option value="">كل المطابخ</option></select></div><div class="count" id="count"></div><div class="providers" id="providers"><div class="empty">جارٍ تحميل المزودين...</div></div></div></section></main>
<footer style="border-top:1px solid var(--line);padding:24px 0"><div class="wrap" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px"><span>© Gulf Catering Hub</span><span><a href="./partner.html" style="color:inherit">شركاء الكيترنغ</a> · <a href="./privacy.html" style="color:inherit">الخصوصية</a></span></div></footer>
<script src="./assets/common.js"></script>
<script>
let profiles=[],packages=[];
const mediaUrl=path=>path?`${GCH.url}/storage/v1/object/public/provider-media/${encodeURI(path)}`:'';
async function boot(){try{const [p,pk]=await Promise.all([GCH.db.from('public_provider_profiles').select('*').order('performance_score',{ascending:false}).order('name'),GCH.db.from('catering_packages').select('id,provider_id,name,category_key,price_per_person,min_people,max_people,lead_time_hours').eq('active',true).eq('review_status','approved')]);if(p.error)throw p.error;if(pk.error)throw pk.error;profiles=p.data||[];packages=pk.data||[];fillFilters();render()}catch(e){console.error(e);document.getElementById('providers').innerHTML='<div class="empty">تعذر تحميل المزودين حاليًا.</div>'}}
function fillFilters(){const areas=[...new Set(profiles.flatMap(p=>p.service_areas||[]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar')),cuisines=[...new Set(profiles.flatMap(p=>p.cuisines||[]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));document.getElementById('area').innerHTML='<option value="">كل المناطق</option>'+areas.map(x=>`<option>${GCH.esc(x)}</option>`).join('');document.getElementById('cuisine').innerHTML='<option value="">كل المطابخ</option>'+cuisines.map(x=>`<option>${GCH.esc(x)}</option>`).join('')}
function render(){const q=(document.getElementById('q').value||'').trim().toLowerCase(),area=document.getElementById('area').value,cuisine=document.getElementById('cuisine').value,rows=profiles.filter(p=>{const text=[p.name,...(p.service_areas||[]),...(p.cuisines||[])].join(' ').toLowerCase();return(!q||text.includes(q))&&(!area||(p.service_areas||[]).includes(area))&&(!cuisine||(p.cuisines||[]).includes(cuisine))});document.getElementById('count').textContent=profiles.length?`${GCH.number(rows.length)} مزود من ${GCH.number(profiles.length)} مزود معتمد`:'';document.getElementById('providers').innerHTML=rows.length?rows.map(card).join(''):profiles.length?'<div class="empty">لا يوجد مزود يطابق البحث الحالي.</div>':'<div class="card empty-market"><h2>لا يوجد مزود منشور بعد</h2><p>تظهر هنا فقط الشركات التي أكملت التحقق التجاري واعتمدتها المنصة.</p></div>'}
function card(p){const ps=packages.filter(x=>x.provider_id===p.provider_id),min=ps.length?Math.min(...ps.map(x=>Number(x.price_per_person||0))):null,rating=Number(p.average_rating||0),reviews=Number(p.review_count||0),cover=mediaUrl(p.cover_path),logo=mediaUrl(p.logo_path),available=!!p.accepting_marketplace_requests&&p.availability_status!=='paused',busy=p.availability_status==='busy';return `<article class="card provider-card"><div class="provider-cover"${cover?` style="background-image:url('${GCH.esc(cover)}')"`:''}>${logo?`<img class="provider-logo" src="${GCH.esc(logo)}" alt="${GCH.esc(p.name)}">`:`<img class="provider-logo" src="./apple-touch-icon.png" alt="">`}</div><div class="provider-body"><div><span class="eyebrow">مزود موثّق</span><h2>${GCH.esc(p.name)}</h2><div class="rating">${reviews?`★ ${rating.toFixed(1)} · ${GCH.number(reviews)} تقييم`:'مزود جديد'}</div><div class="availability"><span class="status ${available?'st-approved':'st-pending'}">${available?(busy?'مشغول — يحتاج مهلة أطول':'يستقبل فرصًا جديدة'):'لا يستقبل فرصًا جديدة حاليًا'}</span></div></div><div class="chips">${(p.service_areas||[]).slice(0,4).map(x=>`<span class="chip">${GCH.esc(x)}</span>`).join('')}${(p.cuisines||[]).slice(0,3).map(x=>`<span class="chip">${GCH.esc(x)}</span>`).join('')}</div><div class="provider-meta"><div class="mini-card"><b>${p.max_capacity?GCH.number(p.max_capacity):'مرن'}</b><span>أقصى سعة</span></div><div class="mini-card"><b>${GCH.number(p.lead_time_hours||24)} ساعة</b><span>أقل مهلة</span></div><div class="mini-card"><b>${GCH.number(ps.length)}</b><span>باقات منشورة</span></div><div class="mini-card"><b>${min!=null?GCH.money(min,'ar',1):'حسب الطلب'}</b><span>يبدأ من / شخص</span></div></div><div class="actions"><a class="primary" href="./provider.html?id=${encodeURIComponent(p.provider_id)}">عرض الملف والباقات</a>${available?`<button class="ghost" onclick="GCHStartDirectProviderRfq('${p.provider_id}')">اطلب عرضًا مباشرًا</button>`:`<a class="ghost" href="./company/?next=rfq">انشر طلبًا عامًا</a>`}</div></div></article>`}
boot();
</script></body></html>
