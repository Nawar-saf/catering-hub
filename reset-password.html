<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>استعادة كلمة المرور | Gulf Catering Hub</title><link rel="icon" href="./favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link rel="stylesheet" href="./assets/common.css"></head><body>
<section class="auth"><div class="authbox"><a class="brand" href="./"><img src="./apple-touch-icon.png" alt=""><span>Gulf Catering Hub</span></a><h1>استعادة كلمة المرور</h1>
<div id="requestBox"><p class="muted">أدخل بريدك الإلكتروني لإرسال رابط الاستعادة.</p><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div><button class="primary" id="sendBtn" style="width:100%" onclick="sendReset()">إرسال رابط الاستعادة</button></div>
<div id="passwordBox" class="hidden"><p class="muted">أدخل كلمة مرور جديدة لحسابك.</p><div class="field"><label>كلمة المرور الجديدة</label><input id="newPassword" type="password" autocomplete="new-password"></div><div class="field"><label>تأكيد كلمة المرور</label><input id="confirmPassword" type="password" autocomplete="new-password"></div><button class="primary" id="saveBtn" style="width:100%" onclick="savePassword()">حفظ كلمة المرور</button></div>
<div class="msg" id="msg"></div><div style="margin-top:12px"><a class="link-btn" href="./">العودة إلى الموقع</a></div></div></section>
<script src="./assets/common.js"></script><script src="./reset.js"></script></body></html>
