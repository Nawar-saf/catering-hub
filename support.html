<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>مركز الدعم | Gulf Catering Hub</title><link rel="icon" href="./favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><link rel="stylesheet" href="./assets/common.css"><style>.layout{display:grid;grid-template-columns:.85fr 1.4fr;gap:12px}.ticket{cursor:pointer}.ticket.active{box-shadow:0 0 0 1px var(--gold)}.chat{min-height:420px;display:flex;flex-direction:column}.messages{display:grid;gap:8px;max-height:520px;overflow:auto;padding:4px}.bubble{max-width:82%;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:#100f0c}.bubble.me{margin-inline-start:auto;border-color:rgba(201,164,92,.45)}.bubble.admin{background:rgba(201,164,92,.08)}.bubble small{display:block;color:var(--muted);margin-top:4px}.composer{margin-top:auto;padding-top:12px}.support-actions{display:flex;gap:7px;flex-wrap:wrap}.gridfilters{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:820px){.layout{grid-template-columns:1fr}.chat{min-height:320px}}</style></head><body>
<header class="topbar"><div class="wrap"><nav><a class="brand" href="./"><img src="./apple-touch-icon.png" alt=""><span>Gulf Catering Hub</span></a><div class="nav-actions"><a class="ghost" id="backLink" href="./">الرجوع</a><button class="ghost" onclick="logout()">خروج</button></div></nav></div></header>
<main class="app" style="display:block"><div class="wrap"><div class="hello"><div><h1>مركز الدعم</h1><p>استفسارات، مشاكل الطلبات، الفواتير، الحسابات أو النزاعات من مكان واحد.</p></div><button class="primary" id="newBtn" onclick="openNew()">+ تذكرة جديدة</button></div><div class="layout"><section class="section"><div class="toolbar"><h2>التذاكر</h2><select id="statusFilter" onchange="renderTickets()"><option value="">الكل</option><option value="open">مفتوحة</option><option value="in_progress">قيد المعالجة</option><option value="waiting_user">بانتظارك</option><option value="resolved">محلولة</option><option value="closed">مغلقة</option></select></div><div class="list" id="ticketList"><div class="empty">جارٍ التحميل...</div></div></section><section class="section chat"><div class="toolbar"><div><h2 id="chatTitle">اختر تذكرة</h2><div class="muted" id="chatMeta"></div></div><div class="support-actions" id="adminActions"></div></div><div class="messages" id="messages"><div class="empty">اختر تذكرة لعرض المحادثة.</div></div><div class="composer hidden" id="composer"><textarea id="messageText" placeholder="اكتب رسالتك..."></textarea><button class="primary" onclick="sendMessage()">إرسال</button></div><div class="msg" id="pageMsg"></div></section></div></div></main>
<div class="modal" id="newModal"><div class="modalbox"><div class="modalhead"><h2>تذكرة دعم جديدة</h2><button class="close" onclick="GCH.closeModal('newModal')">×</button></div><div class="gridfilters"><div class="field"><label>النوع *</label><select id="nCategory"><option value="order">طلب / تنفيذ</option><option value="rfq">عرض أسعار</option><option value="invoice">فاتورة / PO / دفع</option><option value="account">الحساب</option><option value="provider_verification">اعتماد المزود</option><option value="dispute">شكوى / نزاع</option><option value="other">أخرى</option></select></div><div class="field"><label>الأولوية</label><select id="nPriority"><option value="normal">عادية</option><option value="high">عالية</option><option value="urgent">عاجلة</option><option value="low">منخفضة</option></select></div></div><div class="field"><label>العنوان *</label><input id="nSubject"></div><div class="field"><label>رقم الطلب (اختياري)</label><select id="nOrder"><option value="">بدون ربط بطلب</option></select></div><div class="field"><label>التفاصيل *</label><textarea id="nMessage"></textarea></div><button class="primary" id="createBtn" style="width:100%" onclick="createTicket()">فتح التذكرة</button><div class="msg" id="newMsg"></div></div></div>
<script src="./assets/common.js"></script><script>
let user=null,role=null,ownerId=null,tickets=[],orders=[],active=null,messages=[];
const S={open:'مفتوحة',in_progress:'قيد المعالجة',waiting_user:'بانتظار ردك',resolved:'محلولة',closed:'مغلقة'};
async function logout(){await GCH.db.auth.signOut();location.href='./'}
async function boot(){const {data:{user:u}}=await GCH.db.auth.getUser();if(!u){location.href='./';return}user=u;const {data:p,error}=await GCH.db.from('user_profiles').select('role').eq('id',u.id).maybeSingle();if(error||!p){location.href='./';return}role=p.role;if(role==='company'){document.getElementById('backLink').href='./company/';const {data:c}=await GCH.db.from('companies').select('id').limit(1).maybeSingle();ownerId=c?.id;const {data:o}=await GCH.db.from('company_orders').select('id,order_type,event_date,status').eq('company_id',ownerId).order('created_at',{ascending:false}).limit(50);orders=o||[]}else if(role==='provider'){document.getElementById('backLink').href='./provider/';const {data:pv}=await GCH.db.from('catering_providers').select('id').eq('owner_user_id',u.id).maybeSingle();ownerId=pv?.id;const {data:o}=await GCH.db.from('company_orders').select('id,order_type,event_date,status').eq('provider_id',ownerId).order('created_at',{ascending:false}).limit(50);orders=o||[]}else if(role==='admin'){document.getElementById('backLink').href='./inbox/';document.getElementById('newBtn').classList.add('hidden')}else{location.href='./';return}document.getElementById('nOrder').innerHTML='<option value="">بدون ربط بطلب</option>'+orders.map(o=>`<option value="${o.id}">${GCH.esc(o.order_type)} · ${GCH.date(o.event_date)} · ${o.id.slice(0,8)}</option>`).join('');await loadTickets()}
async function loadTickets(){let q=GCH.db.from('support_tickets').select('*').order('last_message_at',{ascending:false});const {data,error}=await q;if(error)return GCH.msg('pageMsg',GCH.genericError(error));tickets=data||[];renderTickets();if(active){const fresh=tickets.find(x=>x.id===active.id);if(fresh){active=fresh;await loadMessages(active.id)}}}
function renderTickets(){const f=document.getElementById('statusFilter').value,rows=f?tickets.filter(x=>x.status===f):tickets;document.getElementById('ticketList').innerHTML=rows.map(t=>`<div class="item ticket ${active?.id===t.id?'active':''}" onclick="openTicket('${t.id}')"><div><b>${GCH.esc(t.subject)}</b><div class="meta">${category(t.category)} · ${t.order_id?'طلب '+t.order_id.slice(0,8):'عام'}<br>${GCH.datetime(t.last_message_at)}</div></div><div><span class="status st-${t.status}">${S[t.status]||t.status}</span>${t.priority==='urgent'?'<div class="status st-rejected" style="margin-top:4px">عاجل</div>':''}</div></div>`).join('')||'<div class="empty">لا توجد تذاكر.</div>'}
function category(x){return{order:'طلب / تنفيذ',rfq:'عرض أسعار',invoice:'مالية',account:'حساب',provider_verification:'اعتماد مزود',dispute:'شكوى / نزاع',other:'أخرى'}[x]||x}
async function openTicket(id){active=tickets.find(x=>x.id===id);if(!active)return;renderTickets();document.getElementById('chatTitle').textContent=active.subject;document.getElementById('chatMeta').textContent=`${category(active.category)} · ${S[active.status]||active.status}${active.order_id?' · طلب '+active.order_id.slice(0,8):''}`;document.getElementById('composer').classList.toggle('hidden',['closed'].includes(active.status));renderAdminActions();await loadMessages(id)}
async function loadMessages(id){const {data,error}=await GCH.db.from('support_messages').select('*').eq('ticket_id',id).order('created_at');if(error)return GCH.msg('pageMsg',GCH.genericError(error));messages=data||[];document.getElementById('messages').innerHTML=messages.map(m=>`<div class="bubble ${m.sender_user_id===user.id?'me':''} ${m.sender_role==='admin'?'admin':''}"><b>${m.sender_role==='admin'?'فريق Gulf Catering Hub':m.sender_role==='company'?'الشركة':'المزود'}</b><div>${GCH.esc(m.message).replace(/\n/g,'<br>')}</div><small>${GCH.datetime(m.created_at)}</small></div>`).join('')||'<div class="empty">لا توجد رسائل بعد.</div>';document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight}
function renderAdminActions(){const h=document.getElementById('adminActions');if(role!=='admin'||!active){h.innerHTML='';return}h.innerHTML=`<select id="adminStatus" onchange="adminSetStatus(this.value)"><option value="open" ${active.status==='open'?'selected':''}>مفتوحة</option><option value="in_progress" ${active.status==='in_progress'?'selected':''}>قيد المعالجة</option><option value="waiting_user" ${active.status==='waiting_user'?'selected':''}>بانتظار المستخدم</option><option value="resolved" ${active.status==='resolved'?'selected':''}>محلولة</option><option value="closed" ${active.status==='closed'?'selected':''}>مغلقة</option></select>`}
function openNew(){GCH.clearMsg('newMsg');GCH.openModal('newModal')}
async function createTicket(){const subject=document.getElementById('nSubject').value.trim(),message=document.getElementById('nMessage').value.trim(),btn=document.getElementById('createBtn');if(!subject||!message)return GCH.msg('newMsg','العنوان والتفاصيل مطلوبان.');GCH.setBusy(btn,true);try{const {data,error}=await GCH.db.from('support_tickets').insert({category:document.getElementById('nCategory').value,priority:document.getElementById('nPriority').value,subject,order_id:document.getElementById('nOrder').value||null}).select().single();if(error)throw error;const {error:me}=await GCH.db.from('support_messages').insert({ticket_id:data.id,message,sender_role:role});if(me)throw me;GCH.msg('newMsg','تم فتح التذكرة.',true);await loadTickets();active=data;setTimeout(()=>{GCH.closeModal('newModal');openTicket(data.id)},600)}catch(e){console.error(e);GCH.msg('newMsg',GCH.genericError(e))}finally{GCH.setBusy(btn,false)}}
async function sendMessage(){if(!active)return;const text=document.getElementById('messageText').value.trim();if(!text)return;try{const {error}=await GCH.db.from('support_messages').insert({ticket_id:active.id,message:text,sender_role:role});if(error)throw error;document.getElementById('messageText').value='';await loadTickets();await openTicket(active.id)}catch(e){GCH.msg('pageMsg',GCH.genericError(e))}}
async function adminSetStatus(status){if(role!=='admin'||!active)return;try{const {error}=await GCH.db.from('support_tickets').update({status}).eq('id',active.id);if(error)throw error;await loadTickets();await openTicket(active.id)}catch(e){GCH.msg('pageMsg',GCH.genericError(e))}}
GCH.setupModal('newModal');GCH.setupEscape();boot();
</script></body></html>
